<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vendas — Dottec</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="_shell.js"></script>
<style>
:root{--cyan:#29B8C2;--cd:#1E9099;--cbg:#E3F4F5;--coral:#E8604A;--cbg2:#FBE9E5;--dark:#1C1C1A;--text:#2C2C2A;--sub:#8A887F;--border:#EAE7DF;--bg:#EDEAE3;--white:#fff;--amber:#9A6000;--abg:#FBEEDB;--green:#3B6D11;--gbg:#EAF3DE;--red:#DC2626;--rbg:#FEF2F2;--purple:#5B3FA6;--pbg:#EEEAF8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden;text-transform:uppercase}
/* FILTER BAR */
.filter-bar{background:var(--white);border-bottom:1px solid var(--border)}
.fb-top{display:flex;align-items:center;gap:10px;padding:8px 16px}
.btn-nova{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 14px;border-radius:8px;background:var(--cyan);color:#fff;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:background .15s}
.btn-nova:hover{background:var(--cd)}
.btn-nova i{font-size:13px}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:0 12px;height:34px;transition:border-color .2s}
.search-box:focus-within{border-color:var(--cyan);background:var(--white)}
.search-box input{flex:1;border:none;background:transparent;font-family:inherit;font-size:12.5px;color:var(--dark);outline:none;text-transform:uppercase}
.search-box i{color:var(--sub);font-size:13px;flex-shrink:0}
.search-cnt{font-size:10px;color:var(--sub);white-space:nowrap}
.status-row{display:flex;align-items:center;overflow-x:auto;padding:0 16px;border-top:1px solid var(--border)}
.status-row::-webkit-scrollbar{display:none}
.sf{height:36px;padding:0 12px;border:none;background:transparent;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.sf.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.sf:hover{color:var(--dark)}
.sf-cnt{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--bg)}
/* BODY + TABELA */
.body{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.table-wrap{flex:1;overflow-y:auto}
table{border-collapse:collapse;width:100%}
thead{position:sticky;top:0;z-index:10;background:var(--white);box-shadow:0 1px 0 var(--border)}
thead th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);padding:10px 14px;border-bottom:1px solid var(--border);background:#FAFAF7;white-space:nowrap}
tbody tr{cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border)}
tbody tr:hover{background:#FAFAF5}
td{padding:10px 14px;font-size:12.5px;color:var(--text);vertical-align:middle}
.td-num{font-size:11px;font-weight:800;color:var(--sub);background:var(--bg);padding:2px 6px;border-radius:5px}
.td-val{font-weight:700;color:var(--dark)}
.td-tempo{font-size:11px;color:var(--sub)}
.td-acts{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.act{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;flex-shrink:0}
.act-ed{background:var(--bg);color:var(--sub)}.act-ed:hover{background:var(--cbg);color:var(--cd)}
.act-del{background:var(--bg);color:var(--sub)}.act-del:hover{background:var(--rbg);color:var(--red)}
/* STATUS BADGE */
.sb{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;text-transform:uppercase}
.sb-conc{background:var(--gbg);color:var(--green)}
.sb-canc{background:var(--rbg);color:var(--red)}
.sb-aber{background:var(--cbg);color:var(--cd)}
/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:3rem;color:var(--sub);font-size:13px}
.empty i{font-size:32px;opacity:.4}
/* TOAST */
.toast{position:fixed;bottom:1.25rem;right:1.25rem;z-index:9999;padding:10px 16px;border-radius:10px;background:var(--dark);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok i{color:#4ade80}.toast.err i{color:#f87171}
/* TF */
.tf{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;font-size:11px;color:var(--sub);border-top:1px solid var(--border);background:var(--white)}
/* OVERLAY/MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(28,28,26,.5);z-index:9999;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--white);border-radius:16px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.18);overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.mh-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.modal-title{font-size:14px;font-weight:700;color:var(--dark);flex:1}
.modal-x{width:28px;height:28px;border-radius:7px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--sub)}
.modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
.btn-pri{height:34px;padding:0 16px;border-radius:8px;border:none;background:var(--cyan);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn-sec{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--white);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{height:36px;border:1.5px solid var(--border);border-radius:7px;padding:0 10px;font-family:inherit;font-size:13px;color:var(--dark);background:#FAFAF7;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--cyan);background:var(--white)}
/* PRINT */
@page{size:A4 portrait;margin:10mm}
@media print{.filter-bar,.tf,#_dottec_shell{display:none!important}}
.act-more-wrap{position:relative}
.act-more-btn{background:var(--bg);color:var(--sub)}.act-more-btn:hover{background:var(--cbg);color:var(--cd)}
.act-more-drop{display:none;position:fixed;background:var(--white);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:200px;z-index:99999;padding:4px}
.act-more-drop.open{display:block}
.amd-item{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;width:100%;border:none;background:transparent;font-family:inherit;text-align:left;transition:background .1s}
.amd-item:hover{background:var(--bg)}
.amd-item i{font-size:14px;width:16px;text-align:center;flex-shrink:0}
.amd-sep{height:1px;background:var(--border);margin:3px 6px}
.amd-label{font-size:9px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;padding:5px 11px 2px}
.act-print-pend{background:var(--rbg);color:var(--red)}.act-print-pend:hover{background:var(--red);color:#fff}
.act-print-ok{background:var(--gbg);color:var(--green)}.act-print-ok:hover{background:var(--green);color:#fff}
.btn-conf{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--white);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;font-family:inherit}
.btn-conf:hover{border-color:var(--cyan);color:var(--cd);background:var(--cbg)}
.conf-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.conf-row:hover{background:var(--bg)}.conf-row.sel{background:var(--cbg)}
.conf-chk{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:10px;color:transparent}
.conf-row.sel .conf-chk{background:var(--cyan);border-color:var(--cyan);color:#fff}
.conf-info{flex:1;min-width:0}
.conf-nome{font-size:12px;font-weight:700;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conf-sub{font-size:10.5px;color:var(--sub)}
.conf-val{font-size:12px;font-weight:700;color:var(--cd);flex-shrink:0}
.conf-badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;flex-shrink:0}
.conf-pend-hdr{padding:8px 16px 4px;font-size:10px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.06em;background:var(--rbg);border-bottom:1px solid rgba(220,38,38,.1)}
.conf-ok-hdr{padding:8px 16px 4px;font-size:10px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.06em;background:var(--gbg);border-bottom:1px solid rgba(59,109,17,.1)}
</style>
</head>
<body>
<div class="toast" id="toast"><i id="ti" class="ti ti-check"></i><span id="tm"></span></div>

<!-- MODAL CONFERÊNCIA -->
<div class="overlay" id="ov-conf">
  <div class="modal" style="max-width:580px;display:flex;flex-direction:column;max-height:88vh">
    <div class="modal-head" style="flex-shrink:0">
      <div class="mh-ico" style="background:var(--cbg);color:var(--cd)"><i class="ti ti-clipboard-check"></i></div>
      <div class="modal-title">Conferência de impressão</div>
      <button class="modal-x" onclick="fecha('conf')"><i class="ti ti-x"></i></button>
    </div>
    <div id="conf-list" style="flex:1;overflow-y:auto"></div>
    <div class="modal-foot" style="flex-shrink:0;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="confSelTodos()" style="height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--white);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit">Selec. todos</button>
        <span id="conf-cnt" style="font-size:11px;color:var(--sub)">0 selecionadas</span>
      </div>
      <div style="display:flex;gap:7px">
        <button class="btn-sec" onclick="fecha('conf')">Fechar</button>
        <button class="btn-pri" onclick="confImprimir('interno')"><i class="ti ti-printer"></i> Imprimir</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL EXCLUIR -->
<div class="overlay" id="ov-del">
  <div class="modal" style="max-width:400px">
    <div class="modal-head">
      <div class="mh-ico" style="background:var(--rbg);color:var(--red)"><i class="ti ti-trash"></i></div>
      <div class="modal-title">Excluir venda <span id="del-num"></span>?</div>
      <button class="modal-x" onclick="fecha('del')"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body"><p style="font-size:13px;color:var(--sub)">Essa ação não pode ser desfeita. Os lançamentos no caixa relacionados também serão removidos.</p></div>
    <div class="modal-foot">
      <button class="btn-sec" onclick="fecha('del')">Cancelar</button>
      <button class="btn-pri" style="background:var(--red)" onclick="confirmarDel()" id="btn-confirmar-del"><i class="ti ti-trash"></i> Excluir</button>
    </div>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <div class="fb-top">
    <a href="venda-nova.html" class="btn-nova"><i class="ti ti-plus"></i> Nova Venda</a>
    <button onclick="abrirConferencia()" class="btn-conf"><i class="ti ti-clipboard-check"></i> Conferência</button>
    <div class="search-box">
      <i class="ti ti-search"></i>
      <input type="text" id="busca" placeholder="Buscar por Nº, cliente ou produto..." autocomplete="off" oninput="filtrar()"/>
      <span class="search-cnt" id="s-cnt"></span>
    </div>
  </div>
  <div class="status-row" id="status-row"></div>
</div>

<!-- BODY -->
<div class="body">
  <!-- Badge pendências -->
  <div id="pend-bar" style="display:none;padding:6px 20px;background:var(--rbg);border-bottom:1px solid rgba(220,38,38,.15);align-items:center;gap:8px;font-size:11.5px;color:var(--red);font-weight:600">
    <i class="ti ti-alert-circle"></i>
    <span id="pend-txt"></span>
    <button onclick="abrirConferencia()" style="margin-left:auto;height:24px;padding:0 10px;border-radius:6px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">
      Ver conferência
    </button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:64px">Nº</th>
          <th style="width:90px">Data</th>
          <th>Cliente</th>
          <th>Itens</th>
          <th style="width:110px;text-align:center">Status</th>
          <th style="width:100px">Total</th>
          <th style="width:80px">Tempo</th>
          <th style="width:32px"></th>
          <th style="width:90px;text-align:right">Ações</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="8"><div class="empty"><i class="ti ti-loader-2"></i>Carregando...</div></td></tr>
      </tbody>
    </table>
  </div>
  <div class="tf">
    <span id="tf-cnt"></span>
    <span>Dottec · Vendas</span>
  </div>
</div>

<script>
const SB_URL='https://clctxzynpfjilxmyblpg.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY3R4enlucGZqaWx4bXlibHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzEyNDMsImV4cCI6MjA5NTM0NzI0M30.YBGIwVFpE52KZKpOjMMMh1WCZbzDLM_adwGxxXhkIL0';
const db=supabase.createClient(SB_URL,SB_KEY);
let USR={nome:'Gaza',perfil:'ADMIN',id:null};
try{const s=sessionStorage.getItem('dottec_sessao');if(s)USR=JSON.parse(s);}catch{}

let TODOS=[], FILTRO='', DEL_ID=null;

const SB_CLS={'CONCLUIDA':'sb-conc','CANCELADA':'sb-canc','ABERTA':'sb-aber'};
const fmtDt=d=>d?new Date(d).toLocaleDateString('pt-BR'):'—';
const fmtVal=v=>'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
const tempo=d=>{const m=Math.floor((new Date()-new Date(d))/60000);if(m<60)return m+'min';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d';};

async function load(){
  const{data:vs}=await db.from('vendas')
    .select('id,numero,nome_cliente,status,total,criado_em,atualizado_em,impresso_em,impresso_tipo,pessoa_id')
    .order('criado_em',{ascending:false}).limit(300);
  TODOS=vs||[];

  // Busca resumo de itens por venda
  const ids=TODOS.map(v=>v.id);
  let ITENS_MAP={};
  if(ids.length){
    const{data:its}=await db.from('venda_itens')
      .select('venda_id,nome,quantidade')
      .in('venda_id',ids);
    (its||[]).forEach(i=>{
      if(!ITENS_MAP[i.venda_id])ITENS_MAP[i.venda_id]=[];
      ITENS_MAP[i.venda_id].push(i);
    });
  }
  TODOS.forEach(v=>v._itens=ITENS_MAP[v.id]||[]);

  buildStatusRow();
  render();
}

function buildStatusRow(){
  const cnts={};
  TODOS.forEach(v=>cnts[v.status]=(cnts[v.status]||0)+1);
  const total=TODOS.length;
  let html=`<button class="sf${FILTRO===''?' active':''}" onclick="setFiltro('')">Todos <span class="sf-cnt">${total}</span></button>`;
  ['ABERTA','CONCLUIDA','CANCELADA'].forEach(s=>{
    const cnt=cnts[s]||0;
    if(!cnt)return;
    html+=`<button class="sf${FILTRO===s?' active':''}" onclick="setFiltro('${s}')">${s} <span class="sf-cnt">${cnt}</span></button>`;
  });
  document.getElementById('status-row').innerHTML=html;
}

function setFiltro(s){FILTRO=s;buildStatusRow();render();}

function filtrar(){
  const q=document.getElementById('busca').value.trim().toUpperCase();
  let lista=TODOS;
  if(FILTRO)lista=lista.filter(v=>v.status===FILTRO);
  if(q)lista=lista.filter(v=>
    String(v.numero||'').padStart(4,'0').includes(q)||
    (v.nome_cliente||'').toUpperCase().includes(q)||
    (v._itens||[]).some(i=>(i.nome||'').toUpperCase().includes(q))
  );
  document.getElementById('s-cnt').textContent=q?lista.length+' resultado'+(lista.length!==1?'s':''):'';
  renderLista(lista);
}

function render(){
  const q=document.getElementById('busca').value.trim().toUpperCase();
  let lista=TODOS;
  if(FILTRO)lista=lista.filter(v=>v.status===FILTRO);
  if(q)lista=lista.filter(v=>
    String(v.numero||'').padStart(4,'0').includes(q)||
    (v.nome_cliente||'').toUpperCase().includes(q)||
    (v._itens||[]).some(i=>(i.nome||'').toUpperCase().includes(q))
  );
  document.getElementById('tf-cnt').textContent=lista.length+' venda'+(lista.length!==1?'s':'');
  renderLista(lista);
}

function irV(e){
  if(e.target.closest('.act,.act-more-wrap'))return;
  const id=e.currentTarget.dataset.vid;
  if(id)irVenda(id);
}
function renderLista(lista){
  const isAdmin=USR.perfil==='ADMIN';
  if(!lista.length){
    document.getElementById('tbody').innerHTML='<tr><td colspan="9"><div class="empty"><i class="ti ti-shopping-off"></i>Nenhuma venda encontrada</div></td></tr>';
    return;
  }
  const precisa=v=>v.status==='CONCLUIDA'||v.status==='AGUARDANDO RETIRADA';
  const pends=TODOS.filter(v=>precisa(v)&&!v.impresso_em);
  const pb=document.getElementById('pend-bar');
  const pt=document.getElementById('pend-txt');
  if(pb){
    if(pends.length){pt.textContent=pends.length+' venda'+(pends.length>1?'s':'')+' sem impresso';pb.style.display='flex';}
    else pb.style.display='none';
  }
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  lista.forEach(v=>{
    const numFmt=String(v.numero||'').padStart(4,'0');
    const cls=SB_CLS[v.status]||'sb-aber';
    const itensRes=v._itens.length
      ?v._itens.slice(0,2).map(i=>i.nome+(i.quantidade>1?' x'+i.quantidade:'')).join(', ')+(v._itens.length>2?' +'+(v._itens.length-2):'')
      :'—';
    const impOk=!!v.impresso_em;
    const pend=precisa(v)&&!impOk;
    const printCls=pend?'act act-print-pend':impOk?'act act-print-ok':'act act-ed';

    const tr=document.createElement('tr');
    tr.dataset.vid=v.id;
    tr.onclick=irV;
    tr.innerHTML=(
      '<td><span class="td-num">'+numFmt+'</span></td>'
      +'<td class="td-tempo">'+fmtDt(v.criado_em)+'</td>'
      +'<td style="font-weight:600;color:var(--dark)">'+(v.nome_cliente||'CONSUMIDOR FINAL')+'</td>'
      +'<td style="font-size:11.5px;color:var(--sub);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+itensRes+'</td>'
      +'<td style="text-align:center"><span class="sb '+cls+'">'+v.status+'</span></td>'
      +'<td class="td-val">'+fmtVal(v.total)+'</td>'
      +'<td class="td-tempo">'+tempo(v.criado_em)+'</td>'
      +'<td><button class="'+printCls+'" title="'+(impOk?'Reimprimir':pend?'Imprimir — PENDENTE':'Imprimir')+'"><i class="ti ti-'+(impOk?'printer-check':'printer')+'"></i></button></td>'
      +'<td><div class="td-acts">'
        +'<button class="act act-ed" title="Editar"><i class="ti ti-pencil"></i></button>'
        +'<div class="act-more-wrap"><button class="act act-more-btn" title="Mais ações"><i class="ti ti-dots-vertical"></i></button>'
        +'<div class="act-more-drop" id="vmd-'+v.id+'"></div></div>'
        +(isAdmin?'<button class="act act-del" title="Excluir"><i class="ti ti-trash"></i></button>':'')
      +'</div></td>'
    );
    // bind eventos nos botões (sem onclick inline)
    const btns=tr.querySelectorAll('button');
    const [btnPrint,btnEd,btnMore,...rest]=btns;
    if(btnPrint)btnPrint.onclick=e=>{e.stopPropagation();imprimirVenda(e,v.id,numFmt,v.nome_cliente||'CONSUMIDOR FINAL',v.total,'interno');};
    if(btnEd)btnEd.onclick=e=>{e.stopPropagation();irVenda(v.id);};
    if(btnMore)btnMore.onclick=e=>{e.stopPropagation();abrirMenu(e,v.id,numFmt,v.nome_cliente||'CONSUMIDOR FINAL',v.status,v.total,impOk);};
    if(rest[0]&&isAdmin)rest[0].onclick=e=>{e.stopPropagation();abrirDel(v.id,'#'+numFmt);};
    tbody.appendChild(tr);
  });
}

// ── MENU DE AÇÕES
let _menuDrop=null;
function abrirMenu(e,vid,num,cliente,status,total,impOk){
  e.stopPropagation();
  document.querySelectorAll('.act-more-drop.open').forEach(d=>d.classList.remove('open'));
  const drop=document.getElementById('vmd-'+vid);
  if(!drop||drop.classList.contains('open')){if(drop)drop.classList.remove('open');return;}
  drop.innerHTML='';

  const mkItem=(ico,cor,txt,fn)=>{
    const b=document.createElement('button');
    b.className='amd-item';
    b.innerHTML='<i class="ti '+ico+'" style="color:'+cor+'"></i> '+txt;
    b.onclick=fn;
    return b;
  };
  const mkLabel=txt=>{const d=document.createElement('div');d.className='amd-label';d.textContent=txt;return d;};
  const mkSep=()=>{const d=document.createElement('div');d.className='amd-sep';return d;};

  drop.appendChild(mkLabel('Venda'));
  drop.appendChild(mkItem('ti-printer','var(--sub)','Imprimir (interno)',e2=>{e2.stopPropagation();imprimirVenda(e2,vid,num,cliente,total,'interno');}));
  drop.appendChild(mkItem('ti-file-invoice','var(--cd)','Imprimir para cliente',e2=>{e2.stopPropagation();imprimirVenda(e2,vid,num,cliente,total,'cliente');}));
  drop.appendChild(mkItem('ti-brand-whatsapp','#25D366','Enviar WhatsApp',e2=>{e2.stopPropagation();enviarWhatsVenda(vid,num,cliente,total,status);}));
  drop.appendChild(mkSep());
  drop.appendChild(mkLabel('Fiscal'));
  drop.appendChild(mkItem('ti-file-invoice','var(--amber)','Emitir NF-e',e2=>{e2.stopPropagation();emitirNFeVenda(vid,num);}));

  const btn=e.currentTarget;
  const r=btn.getBoundingClientRect();
  drop.style.cssText='position:fixed;top:'+(r.bottom+4)+'px;right:'+(window.innerWidth-r.right)+'px;z-index:99999;display:block';
  drop.classList.add('open');
}

document.addEventListener('click',()=>document.querySelectorAll('.act-more-drop.open').forEach(d=>d.classList.remove('open')));

// ── IMPRESSÃO
async function imprimirVenda(e,vid,num,cliente,total,tipo){
  e.stopPropagation();
  document.querySelectorAll('.act-more-drop.open').forEach(d=>d.classList.remove('open'));
  // busca dados
  const[{data:v},{data:its},{data:pags}]=await Promise.all([
    db.from('vendas').select('*').eq('id',vid).single(),
    db.from('venda_itens').select('*').eq('venda_id',vid),
    db.from('pagamentos_venda').select('*').eq('venda_id',vid),
  ]);
  const fmtV=n=>'R$ '+(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
  const fmtD=d=>d?new Date(d).toLocaleDateString('pt-BR'):'—';
  const numFmt=String(num).padStart(4,'0');
  const itsList=(its||[]).map(i=>'<tr><td>'+i.nome+'</td><td style="text-align:center">'+i.quantidade+'x</td><td style="text-align:right">'+fmtV(i.total)+'</td></tr>').join('');
  const pagsList=(pags||[]).map(p=>'<tr><td>'+p.forma_pagamento_nome+'</td><td style="text-align:right">'+fmtV(p.valor)+'</td></tr>').join('');

  let pageHTML;
  if(tipo==='interno'){
    pageHTML='<!DOCTYPE html><html><head><meta charset="UTF-8"/>'
      +'<style>@page{size:A4 portrait;margin:10mm}*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{font-size:10px;color:#111}'
      +'.hdr{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:5px;margin-bottom:8px}'
      +'.num{font-size:18px;font-weight:bold}table{width:100%;border-collapse:collapse;margin-bottom:8px}'
      +'th{font-size:8px;text-align:left;padding:2px 4px;border-bottom:1px solid #ccc;color:#555}'
      +'td{padding:2px 4px;border-bottom:1px solid #eee;font-size:9px}'
      +'.tot td{font-weight:bold;border-top:2px solid #111;border-bottom:none}'
      +'@media print{body{-webkit-print-color-adjust:exact}}</style></head><body>'
      +'<div class="hdr"><div><div style="font-size:13px;font-weight:bold">DOTTEC</div><div style="font-size:9px;color:#555">Assistência Inteligente</div></div>'
      +'<div style="text-align:right"><div class="num">VENDA #'+numFmt+'</div><div style="font-size:9px;color:#555">'+fmtD(v?.criado_em)+'</div></div></div>'
      +'<div style="margin-bottom:6px"><strong>'+( v?.nome_cliente||'CONSUMIDOR FINAL')+'</strong></div>'
      +'<table><tr><th>Item</th><th>Qtd</th><th>Total</th></tr>'+itsList
      +'<tr class="tot"><td colspan="2">TOTAL</td><td style="text-align:right">'+fmtV(v?.total)+'</td></tr></table>'
      +(pagsList?'<table><tr><th>Pagamento</th><th>Valor</th></tr>'+pagsList+'</table>':'')
      +'</body></html>';
  } else {
    // Para cliente — com cabeçalho completo da loja
    pageHTML='<!DOCTYPE html><html><head><meta charset="UTF-8"/>'
      +'<style>@page{size:A4 portrait;margin:12mm}*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{font-size:11px;color:#111}'
      +'.hdr{text-align:center;border-bottom:3px solid #111;padding-bottom:10px;margin-bottom:12px}'
      +'.logo{font-size:22px;font-weight:bold;letter-spacing:2px}.sub{font-size:9px;color:#555;margin-top:2px}'
      +'.info{font-size:9px;color:#555}.divider{border:none;border-top:1px solid #ddd;margin:8px 0}'
      +'.num{font-size:16px;font-weight:bold;margin-bottom:4px}'
      +'table{width:100%;border-collapse:collapse;margin-bottom:10px}'
      +'th{font-size:9px;text-align:left;padding:3px 5px;border-bottom:1.5px solid #111;color:#555;text-transform:uppercase}'
      +'td{padding:3px 5px;border-bottom:1px solid #eee;font-size:10px}'
      +'.tot td{font-weight:bold;font-size:11px;border-top:2px solid #111;border-bottom:none}'
      +'.footer{margin-top:16px;text-align:center;font-size:8.5px;color:#777;border-top:1px solid #ddd;padding-top:8px}'
      +'@media print{body{-webkit-print-color-adjust:exact}}</style></head><body>'
      +'<div class="hdr">'
        +'<div class="logo">DOTTEC</div>'
        +'<div class="sub">Assistência Inteligente</div>'
        +'<div class="info" style="margin-top:4px">Rio dos Cedros · SC</div>'
      +'</div>'
      +'<div style="margin-bottom:8px">'
        +'<div class="num">VENDA #'+numFmt+'</div>'
        +'<div style="font-size:10px;color:#555">Data: '+fmtD(v?.criado_em)+'</div>'
        +'<div style="font-size:11px;font-weight:bold;margin-top:4px">'+( v?.nome_cliente||'CONSUMIDOR FINAL')+'</div>'
      +'</div>'
      +'<hr class="divider"/>'
      +'<table><tr><th>Descrição</th><th>Qtd</th><th>Total</th></tr>'+itsList
      +'<tr class="tot"><td colspan="2">TOTAL</td><td style="text-align:right">'+fmtV(v?.total)+'</td></tr></table>'
      +(pagsList?'<hr class="divider"/><table><tr><th>Forma de pagamento</th><th>Valor</th></tr>'+pagsList+'</table>':'')
      +(v?.observacoes?'<div style="margin-top:8px;font-size:9px;color:#555">Obs: '+v.observacoes+'</div>':'')
      +'<div class="footer">Obrigado pela preferência! · Dottec Assistência Inteligente</div>'
      +'</body></html>';
  }

  // Abre e marca como impresso
  const blob=new Blob([pageHTML],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const win=window.open(url,'_blank');
  if(!win){toast('Popup bloqueado. Permita popups para este site.','err');URL.revokeObjectURL(url);return;}
  setTimeout(()=>URL.revokeObjectURL(url),60000);

  // Marca impresso no banco
  const agora=new Date().toISOString();
  const tiposAnt=v?.impresso_tipo?v.impresso_tipo.split(','):[];
  if(!tiposAnt.includes(tipo.toUpperCase()))tiposAnt.push(tipo.toUpperCase());
  await db.from('vendas').update({impresso_em:agora,impresso_tipo:tiposAnt.join(',')}).eq('id',vid).catch(()=>{});

  // Atualiza local sem recarregar
  const idx=TODOS.findIndex(x=>x.id===vid);
  if(idx>=0){TODOS[idx].impresso_em=agora;TODOS[idx].impresso_tipo=tiposAnt.join(',');}
  render();
  toast('Impressão gerada!');
}

function enviarWhatsVenda(vid,num,cliente,total,status){
  document.querySelectorAll('.act-more-drop.open').forEach(d=>d.classList.remove('open'));
  // busca celular do cliente
  const v=TODOS.find(x=>x.id===vid);
  if(!v?.pessoa_id){toast('Cliente sem WhatsApp cadastrado.','err');return;}
  db.from('pessoas').select('celular').eq('id',v.pessoa_id).single().then(({data})=>{
    const tel=(data?.celular||'').replace(/\D/g,'');
    if(tel.length<10){toast('Cliente sem WhatsApp cadastrado.','err');return;}
    const msg='Ol\u00e1 '+cliente+'!\n\nSua compra #'+String(num).padStart(4,'0')+'\u00a0est\u00e1 '+(status==='AGUARDANDO RETIRADA'?'pronta para retirada':'conclu\u00edda')+'.\nTotal: R$ '+Number(total).toLocaleString('pt-BR',{minimumFractionDigits:2})+'\n\nDottec Assist\u00eancia Inteligente';
window.open('https://wa.me/55'+tel+'?text='+encodeURIComponent(msg),'_blank');
  });
}

function emitirNFeVenda(vid,num){
  document.querySelectorAll('.act-more-drop.open').forEach(d=>d.classList.remove('open'));
  window.open('nfe-nova.html?venda_id='+vid,'_blank');
}

// ── CONFERÊNCIA
let CONF_SEL=new Set();
async function abrirConferencia(){
  CONF_SEL=new Set();
  document.getElementById('ov-conf').classList.add('open');
  const body=document.getElementById('conf-list');
  body.innerHTML='<div style="padding:1.5rem;text-align:center;color:var(--sub)"><i class="ti ti-loader-2"></i></div>';
  const{data}=await db.from('vendas')
    .select('id,numero,nome_cliente,status,total,criado_em,impresso_em')
    .in('status',['CONCLUIDA','AGUARDANDO RETIRADA'])
    .order('criado_em',{ascending:false}).limit(100);
  const lista=data||[];
  const pends=lista.filter(v=>!v.impresso_em);
  const impressos=lista.filter(v=>!!v.impresso_em);
  const fmtV=n=>'R$ '+(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
  const fmtD=d=>d?new Date(d).toLocaleDateString('pt-BR'):'--';
  const tpo=d=>{const m=Math.floor((new Date()-new Date(d))/60000);if(m<60)return m+'min';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d';};

  body.innerHTML='';

  if(!lista.length){
    body.innerHTML='<div style="padding:2rem;text-align:center;color:var(--sub)">Tudo impresso!</div>';
    confAtualizaCnt(); return;
  }

  const mkHdr=(txt,cls)=>{const d=document.createElement('div');d.className=cls;d.textContent=txt;return d;};

  if(pends.length){
    body.appendChild(mkHdr('Pendentes de impressao ('+pends.length+')','conf-pend-hdr'));
    pends.forEach(v=>{
      const num=String(v.numero||'').padStart(4,'0');
      const dias=Math.floor((new Date()-new Date(v.criado_em))/86400000);
      const row=document.createElement('div');
      row.className='conf-row'; row.id='crow-'+v.id;
      row.innerHTML='<div class="conf-chk" id="cchk-'+v.id+'"><i class="ti ti-check"></i></div>'
        +'<div class="conf-info"><div class="conf-nome">VENDA #'+num+' -- '+(v.nome_cliente||'CONSUMIDOR FINAL')+'</div>'
        +'<div class="conf-sub">'+v.status+' . '+tpo(v.criado_em)+'</div></div>'
        +'<div class="conf-val">'+fmtV(v.total)+'</div>'
        +(dias>=2?'<span class="conf-badge" style="background:var(--rbg);color:var(--red)">'+dias+'d</span>':'');
      row.onclick=()=>confToggle(v.id);
      body.appendChild(row);
    });
  }

  if(impressos.length){
    body.appendChild(mkHdr('Ja impressos ('+impressos.length+')','conf-ok-hdr'));
    impressos.forEach(v=>{
      const num=String(v.numero||'').padStart(4,'0');
      const row=document.createElement('div');
      row.className='conf-row'; row.style.opacity='.6'; row.style.cursor='default';
      row.innerHTML='<div class="conf-chk" style="background:var(--green);border-color:var(--green);color:#fff"><i class="ti ti-check"></i></div>'
        +'<div class="conf-info"><div class="conf-nome">VENDA #'+num+' -- '+(v.nome_cliente||'CONSUMIDOR FINAL')+'</div>'
        +'<div class="conf-sub">Impresso em '+fmtD(v.impresso_em)+'</div></div>'
        +'<div class="conf-val">'+fmtV(v.total)+'</div>';
      body.appendChild(row);
    });
  }
  confAtualizaCnt();
}

function confToggle(id){
  const row=document.getElementById('crow-'+id);
  if(CONF_SEL.has(id)){CONF_SEL.delete(id);row?.classList.remove('sel');}
  else{CONF_SEL.add(id);row?.classList.add('sel');}
  confAtualizaCnt();
}
function confSelTodos(){
  const rows=document.querySelectorAll('.conf-row[id^="crow-"]');
  const all=CONF_SEL.size===rows.length;
  if(all){CONF_SEL.clear();rows.forEach(r=>r.classList.remove('sel'));}
  else{rows.forEach(r=>{const id=r.id.replace('crow-','');CONF_SEL.add(id);r.classList.add('sel');});}
  confAtualizaCnt();
}
function confAtualizaCnt(){
  const el=document.getElementById('conf-cnt');
  if(el)el.textContent=CONF_SEL.size+' selecionada'+(CONF_SEL.size!==1?'s':'');
}
async function confImprimir(){
  if(!CONF_SEL.size){toast('Selecione ao menos 1 venda.','err');return;}
  const ids=Array.from(CONF_SEL);
  const[{data:vendas},{data:allIts}]=await Promise.all([
    db.from('vendas').select('*').in('id',ids),
    db.from('venda_itens').select('*').in('venda_id',ids),
  ]);
  const fmtV=n=>'R$ '+(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
  const fmtD=d=>d?new Date(d).toLocaleDateString('pt-BR'):'—';

  function blocoVenda(v){
    const its=(allIts||[]).filter(i=>i.venda_id===v.id);
    const numFmt=String(v.numero||'').padStart(4,'0');
    const rows=its.map(i=>'<tr><td>'+i.nome+'</td><td style="text-align:center">'+i.quantidade+'x</td><td style="text-align:right">'+fmtV(i.total)+'</td></tr>').join('');
    return '<div class="bloco">'
      +'<div class="hdr"><div><div class="logo">DOTTEC</div><div class="sub">Assistência</div></div>'
        +'<div style="text-align:right"><div class="num">VENDA #'+numFmt+'</div><div class="sub">'+fmtD(v.criado_em)+'</div></div></div>'
      +'<div style="font-size:10px;font-weight:bold;margin-bottom:4px">'+( v.nome_cliente||'CONSUMIDOR FINAL')+'</div>'
      +'<table><tr><th>Item</th><th>Qtd</th><th>Total</th></tr>'+rows
        +'<tr class="tot"><td colspan="2">TOTAL</td><td style="text-align:right">'+fmtV(v.total)+'</td></tr></table>'
      +'<div style="font-size:9px;color:#555">Status: '+v.status+'</div>'
    +'</div>';
  }

  const blocos=(vendas||[]).map(blocoVenda);
  const folhas=[];
  for(let i=0;i<blocos.length;i+=2){
    folhas.push('<div class="folha">'+blocos[i]+(blocos[i+1]?'<div class="div"></div>'+blocos[i+1]:'')+'</div>');
  }

  const pageHTML='<!DOCTYPE html><html><head><meta charset="UTF-8"/>'
    +'<style>@page{size:A4 portrait;margin:8mm}*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{font-size:9px;color:#111}'
    +'.folha{display:block;page-break-after:always;break-after:page}'
    +'.bloco{padding:6px 0;break-inside:avoid}'
    +'.div{height:1px;background:#ccc;margin:8px 0}'
    +'.hdr{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:4px;margin-bottom:4px}'
    +'.logo{font-size:13px;font-weight:bold}.sub{font-size:8px;color:#555}.num{font-size:16px;font-weight:bold}'
    +'table{width:100%;border-collapse:collapse;margin-bottom:4px}'
    +'th{font-size:7.5px;text-align:left;padding:1px 3px;border-bottom:1px solid #ccc;color:#555}'
    +'td{padding:1px 3px;border-bottom:1px solid #eee;font-size:8.5px}'
    +'.tot td{font-weight:bold;border-top:2px solid #111;border-bottom:none}'
    +'@media print{body{-webkit-print-color-adjust:exact}.folha:last-child{page-break-after:avoid}}</style></head>'
    +'<body>'+folhas.join('')+'</body></html>';

  const blob=new Blob([pageHTML],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const win=window.open(url,'_blank');
  if(!win){toast('Popup bloqueado.','err');URL.revokeObjectURL(url);return;}
  setTimeout(()=>URL.revokeObjectURL(url),60000);

  // Marca todas como impressas
  const agora=new Date().toISOString();
  await db.from('vendas').update({impresso_em:agora,impresso_tipo:'INTERNO'}).in('id',ids).catch(()=>{});
  ids.forEach(id=>{const v=TODOS.find(x=>x.id===id);if(v){v.impresso_em=agora;v.impresso_tipo='INTERNO';}});
  fecha('conf');
  render();
  toast('Impressão gerada para '+ids.length+' venda'+(ids.length>1?'s':'')+'!');
}

// fecha ao clicar fora
document.getElementById('ov-conf').addEventListener('click',function(e){if(e.target===this)fecha('conf');});
document.getElementById('ov-del').addEventListener('click',function(e){if(e.target===this)fecha('del');});

function abrirDel(id,num){
  DEL_ID=id;
  document.getElementById('del-num').textContent=num;
  document.getElementById('ov-del').classList.add('open');
}
async function confirmarDel(){
  if(!DEL_ID)return;
  try{await db.from('venda_itens').delete().eq('venda_id',DEL_ID);}catch{}
  try{await db.from('caixa_movimentos').delete().eq('referencia','venda:'+DEL_ID);}catch{}
  const{error}=await db.from('vendas').delete().eq('id',DEL_ID);
  if(error){toast('Erro ao excluir: '+error.message,'err');return;}
  fecha('del');
  toast('Venda excluída.');
  TODOS=TODOS.filter(v=>v.id!==DEL_ID);
  DEL_ID=null;
  buildStatusRow();render();
}
function fecha(id){document.getElementById('ov-'+id)?.classList.remove('open');}
function toast(msg,t){const el=document.getElementById('toast');document.getElementById('ti').className='ti '+(t==='err'?'ti-alert-circle':'ti-check');document.getElementById('tm').textContent=msg;el.className='toast '+(t||'ok')+' show';setTimeout(()=>el.classList.remove('show'),3500);}
document.getElementById('ov-conf').addEventListener('click',function(e){if(e.target===this)fecha('conf');});
document.getElementById('ov-del').addEventListener('click',function(e){if(e.target===this)fecha('del');});

load();
