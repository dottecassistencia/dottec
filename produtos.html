<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Produtos — Dottec</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="_shell.js"></script>
<style>
  :root{--cyan:#29B8C2;--cd:#1E9099;--cbg:#E3F4F5;--coral:#E8604A;--coral-dark:#C94835;--cbg2:#FBE9E5;--dark:#1C1C1A;--text:#2C2C2A;--sub:#8A887F;--border:#EAE7DF;--bg:#EDEAE3;--white:#fff;--green:#3B6D11;--gbg:#EAF3DE}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden}

  .content{max-width:1180px;margin:0 auto;padding:.75rem 1.5rem 1.5rem;width:100%}

  /* FILTER BAR */
  .filter-bar{background:var(--white);border-bottom:1px solid var(--border)}
  .fb-top{display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}

  .btn{
    height:34px;padding:0 14px;border-radius:8px;border:none;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;gap:6px;transition:background .15s;text-decoration:none;white-space:nowrap;
  }
  .btn-primary{background:var(--coral);color:#fff}
  .btn-primary:hover{background:var(--coral-dark)}
  .btn-secondary{background:var(--white);color:var(--text);border:1px solid var(--border)}
  .btn-secondary:hover{background:var(--bg)}

  .dropdown-wrap{position:relative}
  .dropdown-menu{
    display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:220px;
    background:#fff;border:1px solid var(--border);border-radius:12px;
    box-shadow:0 10px 36px rgba(0,0,0,.12);padding:6px;z-index:50;
  }
  .dropdown-wrap.open .dropdown-menu{display:block}
  .ddm-item{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;
    font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;text-decoration:none;transition:background .12s;
  }
  .ddm-item i{font-size:15px;color:var(--sub);width:16px}
  .ddm-item:hover{background:var(--bg)}

  .search-wrap{position:relative;min-width:200px;max-width:280px;margin-left:auto}
  .search-wrap input{
    width:100%;height:34px;padding:0 12px 0 34px;border-radius:8px;
    border:1.5px solid var(--border);background:#FAFAF7;font-size:12.5px;font-family:inherit;outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--cyan);background:var(--white)}
  .search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px}

  /* BODY */
  .body{flex:1;overflow-y:auto}

  /* TABELA */
  .table-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden}

  table{width:100%;border-collapse:collapse}
  thead th{
    text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--sub);padding:12px 16px;border-bottom:1px solid var(--border);background:#FAFAF7;
  }
  thead th.right{text-align:right}
  thead th.center{text-align:center}

  tbody td{padding:12px 16px;font-size:13px;color:var(--text);border-bottom:1px solid #F2F0EA}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#FAFAF7}

  .td-codigo{color:var(--sub);font-variant-numeric:tabular-nums;font-weight:600}
  .td-nome{font-weight:600;color:var(--dark)}
  .td-grupo{
    display:inline-flex;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:6px;
    background:var(--cbg);color:var(--cd);margin-top:3px;
  }
  .td-valor{text-align:right;font-weight:700;color:var(--dark);font-variant-numeric:tabular-nums}
  .td-estoque{text-align:center;font-weight:600}
  .estoque-ok{color:var(--green)}
  .estoque-baixo{color:var(--coral-dark)}
  .estoque-zero{color:var(--coral-dark);font-weight:700}

  .actions{display:flex;align-items:center;gap:6px;justify-content:flex-end}
  .act-btn{
    width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .15s;
  }
  .act-edit{background:var(--cbg);color:var(--cd)}
  .act-edit:hover{background:var(--cyan);color:#fff}
  .act-del{background:var(--cbg2);color:var(--coral)}
  .act-del:hover{background:var(--coral);color:#fff}

  .empty-row td{padding:3.5rem 1rem;text-align:center;color:var(--sub)}
  .empty-row i{font-size:32px;display:block;margin-bottom:10px;opacity:.4}
  .empty-row .empty-title{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:4px}
  .empty-row .empty-desc{font-size:12px}

  .table-footer{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--sub);
  }

  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @media (max-width:760px){
    .search-wrap{max-width:none;width:100%;margin-left:0}
    table{font-size:12px}
    thead th, tbody td{padding:9px 10px}
  }
</style>
</head>
<body>

<div class="filter-bar">
  <div class="fb-top">
    <div class="dropdown-wrap" id="add-dropdown">
      <button class="btn btn-primary" onclick="toggleDropdown('add-dropdown')">
        <i class="ti ti-plus"></i> Adicionar
        <i class="ti ti-chevron-down" style="font-size:13px"></i>
      </button>
      <div class="dropdown-menu">
        <a class="ddm-item" href="produto-novo.html"><i class="ti ti-package"></i> Novo produto</a>
        <a class="ddm-item" href="#" onclick="alert('Em breve: gerador de etiqueta'); return false;"><i class="ti ti-barcode"></i> Gerar etiqueta</a>
        <a class="ddm-item" href="#" onclick="alert('Em breve: gestão de grupos'); return false;"><i class="ti ti-category"></i> Grupo de produtos</a>
      </div>
    </div>

    <button class="btn btn-secondary"><i class="ti ti-settings-2"></i> Mais ações</button>

    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="search-input" class="upper" placeholder="Buscar por código, nome ou cód. barras" oninput="filterTable()" />
    </div>
  </div>
</div>

<div class="body" id="body-main">
  <main class="content">
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th style="width:90px">Código</th>
            <th>Nome</th>
            <th style="width:120px" class="right">Valor</th>
            <th style="width:100px" class="center">Estoque</th>
            <th style="width:110px" class="right">Ações</th>
          </tr>
        </thead>
        <tbody id="produtos-tbody">
          <tr class="empty-row">
            <td colspan="5">
              <i class="ti ti-loader-2" style="animation:spin .8s linear infinite"></i>
              Carregando produtos...
            </td>
          </tr>
        </tbody>
      </table>
      <div class="table-footer">
        <span id="table-count">—</span>
        <span>Dottec Assistência</span>
      </div>
    </div>
  </main>
</div>

<script>
  const SB_URL = 'https://clctxzynpfjilxmyblpg.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY3R4enlucGZqaWx4bXlibHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzEyNDMsImV4cCI6MjA5NTM0NzI0M30.YBGIwVFpE52KZKpOjMMMh1WCZbzDLM_adwGxxXhkIL0';
  const db = window._dottecDb||(()=>{const c=supabase.createClient(SB_URL,SB_KEY);window._dottecDb=c;return c;})();

  document.addEventListener('input',e=>{
    if(e.target.classList&&e.target.classList.contains('upper')){
      const pos=e.target.selectionStart,posEnd=e.target.selectionEnd;
      e.target.value=e.target.value.toUpperCase();
      e.target.setSelectionRange(pos,posEnd);
    }
  });

  let TODOS_PRODUTOS = [];

  function toggleDropdown(id) {
    document.querySelectorAll('.dropdown-wrap.open').forEach(d => { if (d.id !== id) d.classList.remove('open'); });
    document.getElementById(id).classList.toggle('open');
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.dropdown-wrap')) {
      document.querySelectorAll('.dropdown-wrap.open').forEach(d => d.classList.remove('open'));
    }
  });

  function fmtMoney(v) {
    return (v ?? 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function estoqueClass(atual, minimo) {
    if (atual <= 0) return 'estoque-zero';
    if (minimo && atual <= minimo) return 'estoque-baixo';
    return 'estoque-ok';
  }

  function renderTable(lista) {
    const tbody = document.getElementById('produtos-tbody');

    if (!lista || lista.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="5">
        <i class="ti ti-package-off"></i>
        <div class="empty-title">Nenhum produto encontrado</div>
        <div class="empty-desc">Cadastre o primeiro produto clicando em "Adicionar".</div>
      </td></tr>`;
      document.getElementById('table-count').textContent = '0 produtos';
      return;
    }

    tbody.innerHTML = lista.map(p => `
      <tr>
        <td class="td-codigo">${String(p.codigo).padStart(3,'0')}</td>
        <td>
          <div class="td-nome">${p.nome}</div>
          ${p.grupo_nome ? `<span class="td-grupo">${p.grupo_nome}</span>` : ''}
        </td>
        <td class="td-valor">R$ ${fmtMoney(p.valor_venda)}</td>
        <td class="td-estoque ${estoqueClass(p.estoque_atual, p.estoque_minimo)}">${fmtMoney(p.estoque_atual).replace('.00','')}</td>
        <td>
          <div class="actions">
            <button class="act-btn act-edit" onclick="editarProduto('${p.id}')" title="Editar"><i class="ti ti-pencil"></i></button>
            <button class="act-btn act-del" onclick="excluirProduto('${p.id}','${p.nome.replace(/'/g,"\\'")}')" title="Excluir"><i class="ti ti-trash"></i></button>
          </div>
        </td>
      </tr>
    `).join('');

    document.getElementById('table-count').textContent = lista.length + (lista.length === 1 ? ' produto' : ' produtos');
  }

  function filterTable() {
    const q = document.getElementById('search-input').value.trim().toUpperCase();
    if (!q) { renderTable(TODOS_PRODUTOS); return; }
    const filtrado = TODOS_PRODUTOS.filter(p =>
      String(p.codigo).includes(q) ||
      (p.nome || '').toUpperCase().includes(q) ||
      (p.codigo_barras || '').toUpperCase().includes(q)
    );
    renderTable(filtrado);
  }

  function editarProduto(id) {
    window.location.href = 'produto-novo.html?id=' + id;
  }

  async function excluirProduto(id, nome) {
    if (!confirm('Excluir o produto "' + nome + '"? Essa ação não pode ser desfeita.')) return;
    const { error } = await db.from('produtos').delete().eq('id', id);
    if (error) {
      alert('Erro ao excluir: ' + error.message);
      return;
    }
    await loadProdutos();
  }

  async function loadProdutos() {
    const { data, error } = await db
      .from('produtos')
      .select('id, codigo, codigo_barras, nome, valor_venda, estoque_atual, estoque_minimo, grupo_id, grupos_produtos(nome)')
      .eq('ativo', true)
      .order('codigo', { ascending: true });

    if (error) {
      document.getElementById('produtos-tbody').innerHTML =
        `<tr class="empty-row"><td colspan="5"><i class="ti ti-alert-circle"></i><div class="empty-title">Erro ao carregar produtos</div><div class="empty-desc">${error.message}</div></td></tr>`;
      return;
    }

    TODOS_PRODUTOS = (data || []).map(p => ({ ...p, grupo_nome: p.grupos_produtos?.nome || null }));
    renderTable(TODOS_PRODUTOS);
  }

  loadProdutos();
</script>
</body>
</html>
