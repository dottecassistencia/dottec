<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Produtos — Dottec</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="_shell.js"></script>
<style>
  :root{--cyan:#29B8C2;--cd:#1E9099;--cbg:#E3F4F5;--coral:#E8604A;--coral-dark:#C94835;--cbg2:#FBE9E5;--dark:#1C1C1A;--text:#2C2C2A;--sub:#8A887F;--border:#EAE7DF;--bg:#EDEAE3;--white:#fff;--green:#3B6D11;--gbg:#EAF3DE}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden}

  .content{max-width:1180px;margin:0 auto;padding:.75rem 1.5rem 1.5rem;width:100%}

  /* FILTER BAR */
  .filter-bar{background:var(--white);border-bottom:1px solid var(--border)}
  .fb-top{display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}

  .btn{
    height:34px;padding:0 14px;border-radius:8px;border:none;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;gap:6px;transition:background .15s;text-decoration:none;white-space:nowrap;
  }
  .btn-primary{background:var(--coral);color:#fff}
  .btn-primary:hover{background:var(--coral-dark)}
  .btn-secondary{background:var(--white);color:var(--text);border:1px solid var(--border)}
  .btn-secondary:hover{background:var(--bg)}

  .dropdown-wrap{position:relative}
  .dropdown-menu{
    display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:220px;
    background:#fff;border:1px solid var(--border);border-radius:12px;
    box-shadow:0 10px 36px rgba(0,0,0,.12);padding:6px;z-index:50;
  }
  .dropdown-wrap.open .dropdown-menu{display:block}
  .ddm-item{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;
    font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;text-decoration:none;transition:background .12s;
  }
  .ddm-item i{font-size:15px;color:var(--sub);width:16px}
  .ddm-item:hover{background:var(--bg)}

  .search-wrap{position:relative;min-width:200px;max-width:280px}
  .search-wrap input{
    width:100%;height:34px;padding:0 12px 0 34px;border-radius:8px;
    border:1.5px solid var(--border);background:#FAFAF7;font-size:12.5px;font-family:inherit;outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--cyan);background:var(--white)}
  .search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px}

  /* BODY */
  .body{flex:1;overflow-y:auto}

  /* TABELA */
  .table-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden}

  table{width:100%;border-collapse:collapse}
  thead th{
    text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--sub);padding:12px 16px;border-bottom:1px solid var(--border);background:#FAFAF7;
  }
  thead th.right{text-align:right}
  thead th.center{text-align:center}

  tbody td{padding:12px 16px;font-size:13px;color:var(--text);border-bottom:1px solid #F2F0EA}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#FAFAF7}

  .td-codigo{color:var(--sub);font-variant-numeric:tabular-nums;font-weight:600}
  .td-nome{font-weight:600;color:var(--dark)}
  .td-grupo{
    display:inline-flex;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:6px;
    background:var(--cbg);color:var(--cd);margin-top:3px;
  }
  .td-valor{text-align:right;font-weight:700;color:var(--dark);font-variant-numeric:tabular-nums}
  .td-estoque{text-align:center;font-weight:600}
  .estoque-ok{color:var(--green)}
  .estoque-baixo{color:var(--coral-dark)}
  .estoque-zero{color:var(--coral-dark);font-weight:700}

  .actions{display:flex;align-items:center;gap:6px;justify-content:flex-end}
  .act-btn{
    width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .15s;
  }
  .act-edit{background:var(--cbg);color:var(--cd)}
  .act-edit:hover{background:var(--cyan);color:#fff}
  .act-mov{background:var(--gbg);color:var(--green)}
  .act-mov:hover{background:var(--green);color:#fff}
  .act-del{background:var(--cbg2);color:var(--coral)}
  .act-del:hover{background:var(--coral);color:#fff}

  .empty-row td{padding:3.5rem 1rem;text-align:center;color:var(--sub)}
  .empty-row i{font-size:32px;display:block;margin-bottom:10px;opacity:.4}
  .empty-row .empty-title{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:4px}
  .empty-row .empty-desc{font-size:12px}

  .table-footer{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--sub);
  }

  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @media (max-width:760px){
    .search-wrap{max-width:none;width:100%;margin-left:0}
    table{font-size:12px}
    thead th, tbody td{padding:9px 10px}
  }

  /* MODAL (padrão do app) */
  .overlay{display:none;position:fixed;inset:0;background:rgba(28,28,26,.5);z-index:9999;align-items:center;justify-content:center;padding:1rem}
  .overlay.open{display:flex}
  .modal{background:var(--white);border-radius:16px;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.18)}
  .mh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
  .mh-ico{width:32px;height:32px;border-radius:8px;background:var(--cbg);color:var(--cd);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .mh-title{font-size:14px;font-weight:700;color:var(--dark);flex:1}
  .mx{width:28px;height:28px;border-radius:7px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--sub)}
  .mb{padding:10px 14px;overflow-y:auto}
  .mf{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
  .hist-empty{text-align:center;padding:2.5rem 1rem;color:var(--sub);font-size:12.5px}
  .hist-empty i{font-size:28px;display:block;margin-bottom:8px;opacity:.35}

  /* SUGESTÃO DE COMPRAS */
  .sug-forn{margin-bottom:14px}
  .sug-forn:last-child{margin-bottom:0}
  .sug-forn-head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:8px 8px 0 0;font-size:12px;font-weight:800;color:var(--dark)}
  .sug-forn-head i{color:var(--cd)}
  .sug-forn-count{margin-left:auto;font-size:10px;font-weight:700;color:var(--sub);background:var(--white);padding:2px 7px;border-radius:5px}
  .sug-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-top:none;font-size:12.5px}
  .sug-forn .sug-item:last-child{border-radius:0 0 8px 8px}
  .sug-item-nome{flex:1;font-weight:600;color:var(--dark)}
  .sug-item-qtd{font-size:11px;color:var(--coral-dark);font-weight:700;white-space:nowrap}

  /* MOVIMENTAR ESTOQUE */
  .mov-resumo{background:var(--bg);border-radius:9px;padding:10px 12px;margin-bottom:14px}
  .mov-resumo-nome{font-size:12.5px;font-weight:700;color:var(--dark)}
  .mov-resumo-estoque{font-size:11px;color:var(--sub);margin-top:2px}
  .seg{display:flex;background:var(--bg);border-radius:8px;padding:2px;margin-bottom:14px}
  .seg-btn{flex:1;height:34px;border:none;background:transparent;border-radius:6px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px}
  .seg-btn.active.entrada{background:var(--white);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .seg-btn.active.saida{background:var(--white);color:var(--coral);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
  .field input{width:100%;height:38px;padding:0 12px;border:1.5px solid var(--border);border-radius:8px;background:#FAFAF7;color:var(--dark);font-size:13px;font-family:inherit;outline:none}
  .field input:focus{border-color:var(--cyan);background:#fff}
  .btn-sec{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--white);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-pri{height:36px;padding:0 18px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}

  /* MODAL ETIQUETAS — grandão */
  .modal-etq{background:var(--white);border-radius:16px;width:100%;max-width:1200px;height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.25);overflow:hidden}
  .etq-toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
  .fb-search{position:relative;flex:1;min-width:160px}
  .fb-search input{width:100%;height:34px;border:1.5px solid var(--border);border-radius:8px;padding:0 12px 0 32px;font-family:inherit;font-size:12.5px;color:var(--dark);background:#FAFAF7;outline:none}
  .fb-search input:focus{border-color:var(--cyan);background:var(--white)}
  .fb-search i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px}
  .sel-preset{height:34px;border:1.5px solid var(--border);border-radius:8px;padding:0 10px;font-family:inherit;font-size:12px;font-weight:600;color:var(--dark);background:#FAFAF7;outline:none}
  .fb-count{font-size:11.5px;color:var(--sub);font-weight:600;white-space:nowrap;margin-left:auto}

  .etq-body{flex:1;display:grid;grid-template-columns:1fr 440px;overflow:hidden}
  .etq-list-panel{overflow-y:auto;padding:12px 16px;border-right:1px solid var(--border)}
  .etq-preview-panel{overflow-y:auto;background:#DEDBD2;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .etq-preview-info{font-size:11.5px;color:var(--sub);text-align:center;line-height:1.5}

  .prod-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);margin-bottom:6px}
  .prod-row.checked{border-color:var(--cyan);background:var(--cbg)}
  .prod-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:#fff}
  .prod-row.checked .prod-check{background:var(--cyan);border-color:var(--cyan);color:#fff}
  .prod-info{flex:1;min-width:0;cursor:pointer}
  .prod-nome{font-size:12.5px;font-weight:700;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prod-meta{font-size:10.5px;color:var(--sub);margin-top:1px}
  .prod-qtd{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .prod-qtd button{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}
  .prod-qtd input{width:34px;height:22px;border:1px solid var(--border);border-radius:6px;text-align:center;font-size:11.5px;font-family:inherit;outline:none}

  .etq-cfg-panel{display:none;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px;width:100%;max-width:320px;font-size:11.5px}
  .etq-cfg-panel.open{display:block}
  .cfg-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .cfg-row label{display:block;font-size:9.5px;font-weight:700;color:var(--sub);text-transform:uppercase;margin-bottom:3px}
  .cfg-row input{width:100%;height:28px;border:1px solid var(--border);border-radius:6px;padding:0 8px;font-family:inherit;font-size:11.5px}

  .sheet{background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.15);display:grid;zoom:.42}
  .label{border:1px dashed #ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:1mm}
  .label-nome{font-size:2.3mm;font-weight:700;text-align:center;line-height:1.15;max-height:6mm;overflow:hidden;width:100%;text-transform:uppercase}
  .label-preco{font-size:3mm;font-weight:800;margin-top:.3mm}
  .label-barcode{width:100%;display:flex;justify-content:center;margin-top:.3mm}
  .label-barcode svg{width:100%;height:auto;max-height:9mm}
  .label-codigo{font-size:2mm;color:#555;font-variant-numeric:tabular-nums;margin-top:.2mm}
  .label-empty{border-style:dashed;border-color:#ddd}

  @media print{
    @page{size:A4;margin:0}
    body *{visibility:hidden}
    #etq-print-area, #etq-print-area *{visibility:visible}
    #etq-print-area{position:absolute;left:0;top:0}
    .sheet{box-shadow:none;zoom:1}
  }
  @media(max-width:900px){
    .etq-body{grid-template-columns:1fr;overflow-y:auto}
    .etq-list-panel{border-right:none;overflow:visible}
    .modal-etq{max-width:96vw}
  }
</style>
</head>
<body>

<!-- MODAL TIRAR ETIQUETAS (grandão — só fecha pelo X) -->
<div class="overlay" id="ov-etiquetas">
  <div class="modal-etq">
    <div class="mh">
      <div class="mh-ico"><i class="ti ti-barcode"></i></div>
      <div class="mh-title">Tirar etiquetas</div>
      <button class="mx" onclick="fecharEtiquetas()"><i class="ti ti-x"></i></button>
    </div>
    <div class="etq-toolbar">
      <div class="fb-search" style="max-width:260px">
        <i class="ti ti-search"></i><input id="etq-busca" class="upper" placeholder="Buscar produto..." oninput="etqRenderLista()"/>
      </div>
      <select class="sel-preset" id="etq-preset" onchange="etqOnPresetChange()">
        <option value="pimaco6180">Pimaco 6180 — 2×10 (99,1×25,4mm)</option>
        <option value="pimaco6183">Pimaco 6183 — 3×8 (63,5×25,4mm)</option>
        <option value="pimaco6187">Pimaco 6187 — 5×13 (38,1×21,2mm)</option>
        <option value="pimaco6082">Pimaco 6082 — 3×9 (66,6×25,4mm)</option>
        <option value="custom">Personalizado...</option>
      </select>
      <button class="btn btn-secondary" onclick="etqMarcarTodos(true)"><i class="ti ti-checkbox"></i> Marcar todos</button>
      <button class="btn btn-secondary" onclick="etqMarcarTodos(false)"><i class="ti ti-square"></i> Limpar</button>
      <a href="etiquetas.html" class="btn btn-secondary" style="color:var(--cd)"><i class="ti ti-settings"></i> Configurar padrão</a>
      <span class="fb-count" id="etq-count">0 selecionados</span>
      <button class="btn btn-primary" onclick="etqImprimir()"><i class="ti ti-printer"></i> Imprimir</button>
    </div>
    <div class="etq-body">
      <div class="etq-list-panel" id="etq-list-panel"></div>
      <div class="etq-preview-panel">
        <div class="etq-cfg-panel" id="etq-cfg-panel">
          <div class="cfg-row">
            <div><label>Largura (mm)</label><input type="number" id="etq-cfg-w" value="99.1" step="0.1" oninput="etqRenderPreview()"/></div>
            <div><label>Altura (mm)</label><input type="number" id="etq-cfg-h" value="25.4" step="0.1" oninput="etqRenderPreview()"/></div>
          </div>
          <div class="cfg-row">
            <div><label>Colunas</label><input type="number" id="etq-cfg-cols" value="2" min="1" oninput="etqRenderPreview()"/></div>
            <div><label>Linhas</label><input type="number" id="etq-cfg-rows" value="10" min="1" oninput="etqRenderPreview()"/></div>
          </div>
          <div class="cfg-row">
            <div><label>Margem topo (mm)</label><input type="number" id="etq-cfg-mt" value="0" step="0.1" oninput="etqRenderPreview()"/></div>
            <div><label>Margem esquerda (mm)</label><input type="number" id="etq-cfg-ml" value="0" step="0.1" oninput="etqRenderPreview()"/></div>
          </div>
        </div>
        <div id="etq-print-area"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL MOVIMENTAR ESTOQUE -->
<div class="overlay" id="ov-mov" onclick="if(event.target===this)fecharMov()">
  <div class="modal" style="max-width:400px">
    <div class="mh">
      <div class="mh-ico"><i class="ti ti-arrows-exchange"></i></div>
      <div class="mh-title">Movimentar estoque</div>
      <button class="mx" onclick="fecharMov()"><i class="ti ti-x"></i></button>
    </div>
    <div class="mb">
      <div class="mov-resumo">
        <div class="mov-resumo-nome" id="mov-nome"></div>
        <div class="mov-resumo-estoque">Estoque atual: <strong id="mov-estoque-atual"></strong> un.</div>
      </div>
      <div class="seg">
        <button class="seg-btn active entrada" id="mov-btn-entrada" onclick="setMovTipo('ENTRADA')"><i class="ti ti-plus"></i> Entrada</button>
        <button class="seg-btn saida" id="mov-btn-saida" onclick="setMovTipo('SAIDA')"><i class="ti ti-minus"></i> Saída</button>
      </div>
      <div class="field">
        <label>Quantidade</label>
        <input type="number" id="mov-qtd" min="1" value="1"/>
      </div>
      <div class="field">
        <label>Motivo <span style="font-weight:400;text-transform:none;font-size:9px">(opcional)</span></label>
        <input type="text" id="mov-motivo" class="upper" placeholder="EX: AJUSTE, PERDA, DEVOLUÇÃO..."/>
      </div>
    </div>
    <div class="mf">
      <button class="btn-sec" onclick="fecharMov()">Cancelar</button>
      <button class="btn-pri" id="mov-btn-confirmar" onclick="salvarMovimentacao()"><i class="ti ti-check"></i> Confirmar</button>
    </div>
  </div>
</div>

<!-- MODAL SUGESTÃO DE COMPRAS -->
<div class="overlay" id="ov-sugestao" onclick="if(event.target===this)fecharSugestao()">
  <div class="modal">
    <div class="mh">
      <div class="mh-ico"><i class="ti ti-truck-delivery"></i></div>
      <div class="mh-title">Sugestão de compras</div>
      <button class="mx" onclick="fecharSugestao()"><i class="ti ti-x"></i></button>
    </div>
    <div class="mb" id="sugestao-body"><div class="hist-empty"><i class="ti ti-loader-2" style="animation:spin .8s linear infinite"></i></div></div>
  </div>
</div>

<div class="filter-bar">
  <div class="fb-top">
    <a class="btn btn-primary" href="produto-novo.html"><i class="ti ti-plus"></i> Adicionar</a>

    <div class="dropdown-wrap" id="mais-dropdown">
      <button class="btn btn-secondary" onclick="toggleDropdown('mais-dropdown')">
        <i class="ti ti-settings-2"></i> Mais opções
        <i class="ti ti-chevron-down" style="font-size:13px"></i>
      </button>
      <div class="dropdown-menu">
        <a class="ddm-item" href="#" onclick="abrirEtiquetas(); return false;"><i class="ti ti-barcode"></i> Tirar etiquetas</a>
        <a class="ddm-item" href="#" onclick="alert('Em breve: gestão de grupos'); return false;"><i class="ti ti-category"></i> Grupo de produtos</a>
        <div style="height:1px;background:var(--border);margin:5px 4px"></div>
        <a class="ddm-item" href="#" onclick="abrirSugestaoCompras(); return false;"><i class="ti ti-truck-delivery"></i> Sugestão de compras</a>
      </div>
    </div>

    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="search-input" class="upper" placeholder="Buscar por código, nome ou cód. barras" oninput="filterTable()" />
    </div>
  </div>
</div>

<div class="body" id="body-main">
  <main class="content">
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th style="width:90px">Código</th>
            <th>Nome</th>
            <th style="width:120px" class="right">Valor</th>
            <th style="width:100px" class="center">Estoque</th>
            <th style="width:140px" class="right">Ações</th>
          </tr>
        </thead>
        <tbody id="produtos-tbody">
          <tr class="empty-row">
            <td colspan="5">
              <i class="ti ti-loader-2" style="animation:spin .8s linear infinite"></i>
              Carregando produtos...
            </td>
          </tr>
        </tbody>
      </table>
      <div class="table-footer">
        <span id="table-count">—</span>
        <span>Dottec Assistência</span>
      </div>
    </div>
  </main>
</div>

<script>
  const SB_URL = 'https://clctxzynpfjilxmyblpg.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY3R4enlucGZqaWx4bXlibHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzEyNDMsImV4cCI6MjA5NTM0NzI0M30.YBGIwVFpE52KZKpOjMMMh1WCZbzDLM_adwGxxXhkIL0';
  const db = window._dottecDb||(()=>{const c=supabase.createClient(SB_URL,SB_KEY);window._dottecDb=c;return c;})();

  document.addEventListener('input',e=>{
    if(e.target.classList&&e.target.classList.contains('upper')){
      const pos=e.target.selectionStart,posEnd=e.target.selectionEnd;
      e.target.value=e.target.value.toUpperCase();
      e.target.setSelectionRange(pos,posEnd);
    }
  });

  let TODOS_PRODUTOS = [];

  // sessão do usuário (mesma chave que o _shell.js usa)
  let USR = { nome: 'Usuário', perfil: 'ADMIN', id: null };
  try { const s = sessionStorage.getItem('dottec_sessao'); if (s) USR = JSON.parse(s); } catch {}

  // ── MOVIMENTAR ESTOQUE ───────────────────────────────────────
  let MOV_PRODUTO = null, MOV_TIPO = 'ENTRADA';
  function abrirMovimentar(id) {
    const p = TODOS_PRODUTOS.find(x => String(x.id) === String(id));
    if (!p) return;
    MOV_PRODUTO = p;
    MOV_TIPO = 'ENTRADA';
    document.getElementById('mov-nome').textContent = p.nome;
    document.getElementById('mov-estoque-atual').textContent = p.estoque_atual ?? 0;
    document.getElementById('mov-qtd').value = 1;
    document.getElementById('mov-motivo').value = '';
    setMovTipo('ENTRADA');
    document.getElementById('ov-mov').classList.add('open');
    setTimeout(() => document.getElementById('mov-qtd').focus(), 50);
  }
  function fecharMov() { document.getElementById('ov-mov').classList.remove('open'); }
  function setMovTipo(t) {
    MOV_TIPO = t;
    document.getElementById('mov-btn-entrada').classList.toggle('active', t === 'ENTRADA');
    document.getElementById('mov-btn-saida').classList.toggle('active', t === 'SAIDA');
    const btn = document.getElementById('mov-btn-confirmar');
    btn.style.background = t === 'ENTRADA' ? 'var(--green)' : 'var(--coral)';
  }
  async function salvarMovimentacao() {
    if (!MOV_PRODUTO) return;
    const qtd = parseInt(document.getElementById('mov-qtd').value) || 0;
    const motivo = document.getElementById('mov-motivo').value.trim().toUpperCase();
    if (qtd <= 0) { alert('Informe uma quantidade válida.'); return; }
    const estoqueAtual = Number(MOV_PRODUTO.estoque_atual || 0);
    if (MOV_TIPO === 'SAIDA' && qtd > estoqueAtual) {
      if (!confirm('A quantidade de saída (' + qtd + ') é maior que o estoque atual (' + estoqueAtual + '). Isso vai deixar o estoque negativo. Continuar mesmo assim?')) return;
    }
    const novoEstoque = MOV_TIPO === 'ENTRADA' ? estoqueAtual + qtd : estoqueAtual - qtd;

    const btn = document.getElementById('mov-btn-confirmar');
    btn.disabled = true;
    const { error } = await db.from('produtos').update({ estoque_atual: novoEstoque }).eq('id', MOV_PRODUTO.id);
    if (error) { alert('Erro ao movimentar: ' + error.message); btn.disabled = false; return; }

    // notifica o administrador (tabela usada pelo painel "Notificações Produtos" no dashboard)
    try {
      const descricao = (MOV_TIPO === 'ENTRADA' ? 'ENTRADA de ' : 'SAÍDA de ') + qtd + ' un. — ' + MOV_PRODUTO.nome + (motivo ? ' (' + motivo + ')' : '') + ' — por ' + USR.nome;
      await db.from('produtos_notificacoes').insert({
        produto_id: MOV_PRODUTO.id, tipo: 'MOVIMENTACAO', descricao,
        usuario_nome: USR.nome, lida: false,
      });
    } catch (e) { console.warn('notificacao:', e); }

    btn.disabled = false;
    fecharMov();
    await loadProdutos();
  }

  // ── SUGESTÃO DE COMPRAS ─────────────────────────────────────
  // Regra: produtos ativos com estoque_atual <= estoque_minimo (e minimo definido > 0)
  // Agrupados por fornecedor (fornecedor_id do produto). Sem fornecedor cadastrado = "Sem fornecedor definido".
  async function abrirSugestaoCompras() {
    document.querySelectorAll('.dropdown-wrap.open').forEach(d => d.classList.remove('open'));
    document.getElementById('ov-sugestao').classList.add('open');
    document.getElementById('sugestao-body').innerHTML = '<div class="hist-empty"><i class="ti ti-loader-2" style="animation:spin .8s linear infinite"></i></div>';

    const { data, error } = await db.from('produtos')
      .select('id,nome,estoque_atual,estoque_minimo,fornecedor_id')
      .eq('ativo', true)
      .gt('estoque_minimo', 0);

    if (error) {
      document.getElementById('sugestao-body').innerHTML = `<div class="hist-empty"><i class="ti ti-alert-circle"></i>Erro: ${error.message}</div>`;
      return;
    }

    const baixos = (data || []).filter(p => Number(p.estoque_atual || 0) <= Number(p.estoque_minimo || 0));
    if (!baixos.length) {
      document.getElementById('sugestao-body').innerHTML = '<div class="hist-empty"><i class="ti ti-check"></i>Nenhum produto abaixo do estoque mínimo agora.</div>';
      return;
    }

    // busca nomes dos fornecedores separadamente (evita depender de FK configurada pro embedded join)
    const fornIds = [...new Set(baixos.map(p => p.fornecedor_id).filter(Boolean))];
    let fornMap = {};
    if (fornIds.length) {
      const { data: forns } = await db.from('pessoas').select('id,nome').in('id', fornIds);
      (forns || []).forEach(f => { fornMap[f.id] = f.nome; });
    }

    // agrupa por fornecedor
    const porForn = {};
    baixos.forEach(p => {
      const chave = p.fornecedor_id || '__sem__';
      const nomeForn = fornMap[p.fornecedor_id] || 'Sem fornecedor definido';
      if (!porForn[chave]) porForn[chave] = { nome: nomeForn, itens: [] };
      const sugerido = Math.max(1, Number(p.estoque_minimo || 0) - Number(p.estoque_atual || 0));
      porForn[chave].itens.push({ nome: p.nome, sugerido });
    });

    document.getElementById('sugestao-body').innerHTML = Object.values(porForn).map(f => `
      <div class="sug-forn">
        <div class="sug-forn-head"><i class="ti ti-truck-delivery"></i> ${f.nome}<span class="sug-forn-count">${f.itens.length} ${f.itens.length===1?'item':'itens'}</span></div>
        ${f.itens.map(it => `
          <div class="sug-item">
            <span class="sug-item-nome">${it.nome}</span>
            <span class="sug-item-qtd">sugerido: ${it.sugerido} un.</span>
          </div>`).join('')}
      </div>`).join('');
  }
  function fecharSugestao() { document.getElementById('ov-sugestao').classList.remove('open'); }

  // ── MODAL TIRAR ETIQUETAS ───────────────────────────────────
  let ETQ_SELECIONADOS = {}; // id -> qtd
  let ETQ_CAMPOS = { showNome: true, showBarcode: true, showCodigo: true, showPreco: true };
  const ETQ_PRESETS = {
    pimaco6180: { w: 99.1, h: 25.4, cols: 2, rows: 10, mt: 0, ml: 0 },
    pimaco6183: { w: 63.5, h: 25.4, cols: 3, rows: 8, mt: 0, ml: 0 },
    pimaco6187: { w: 38.1, h: 21.2, cols: 5, rows: 13, mt: 0, ml: 0 },
    pimaco6082: { w: 66.6, h: 25.4, cols: 3, rows: 9, mt: 0, ml: 0 },
  };

  async function abrirEtiquetas() {
    document.querySelectorAll('.dropdown-wrap.open').forEach(d => d.classList.remove('open'));
    document.getElementById('ov-etiquetas').classList.add('open');
    ETQ_SELECIONADOS = {};

    // carrega o padrão salvo em Configurações > Etiquetas (se existir)
    try {
      const { data } = await db.from('configuracoes_sistema').select('valor').eq('chave', 'etiqueta_config').maybeSingle();
      if (data?.valor) {
        const cfg = JSON.parse(data.valor);
        document.getElementById('etq-preset').value = cfg.preset || 'pimaco6180';
        document.getElementById('etq-cfg-w').value = cfg.w ?? 99.1;
        document.getElementById('etq-cfg-h').value = cfg.h ?? 25.4;
        document.getElementById('etq-cfg-cols').value = cfg.cols ?? 2;
        document.getElementById('etq-cfg-rows').value = cfg.rows ?? 10;
        document.getElementById('etq-cfg-mt').value = cfg.mt ?? 0;
        document.getElementById('etq-cfg-ml').value = cfg.ml ?? 0;
        document.getElementById('etq-cfg-panel').classList.toggle('open', cfg.preset === 'custom');
        ETQ_CAMPOS = { showNome: cfg.showNome ?? true, showBarcode: cfg.showBarcode ?? true, showCodigo: cfg.showCodigo ?? true, showPreco: cfg.showPreco ?? true };
      }
    } catch {}

    etqRenderLista();
    etqAtualizarContador();
    etqRenderPreview();
  }
  function fecharEtiquetas() { document.getElementById('ov-etiquetas').classList.remove('open'); }

  function etqRenderLista() {
    const q = (document.getElementById('etq-busca').value || '').trim().toUpperCase();
    let lista = TODOS_PRODUTOS;
    if (q) lista = lista.filter(p => (p.nome || '').toUpperCase().includes(q) || String(p.codigo).includes(q) || (p.codigo_barras || '').toUpperCase().includes(q));

    if (!lista.length) {
      document.getElementById('etq-list-panel').innerHTML = '<div class="hist-empty"><i class="ti ti-package-off"></i>Nenhum produto encontrado</div>';
      return;
    }
    document.getElementById('etq-list-panel').innerHTML = lista.map(p => {
      const marcado = ETQ_SELECIONADOS[p.id] !== undefined;
      const qtd = ETQ_SELECIONADOS[p.id] || 1;
      return `<div class="prod-row${marcado ? ' checked' : ''}">
        <div class="prod-check" onclick="etqToggle('${p.id}')"><i class="ti ti-check" style="${marcado ? '' : 'display:none'}"></i></div>
        <div class="prod-info" onclick="etqToggle('${p.id}')">
          <div class="prod-nome">${p.nome}</div>
          <div class="prod-meta">Cód. ${String(p.codigo).padStart(3,'0')}${p.codigo_barras ? ' · '+p.codigo_barras : ' · sem cód. de barras'} · R$ ${fmtMoney(p.valor_venda)}</div>
        </div>
        <div class="prod-qtd">
          <button onclick="etqAlterarQtd('${p.id}',-1)"><i class="ti ti-minus"></i></button>
          <input type="number" min="1" value="${qtd}" onchange="etqSetQtd('${p.id}',this.value)"/>
          <button onclick="etqAlterarQtd('${p.id}',1)"><i class="ti ti-plus"></i></button>
        </div>
      </div>`;
    }).join('');
  }
  function etqToggle(id) {
    if (ETQ_SELECIONADOS[id] !== undefined) delete ETQ_SELECIONADOS[id];
    else ETQ_SELECIONADOS[id] = 1;
    etqRenderLista(); etqAtualizarContador(); etqRenderPreview();
  }
  function etqAlterarQtd(id, delta) {
    if (ETQ_SELECIONADOS[id] === undefined) return;
    ETQ_SELECIONADOS[id] = Math.max(1, (ETQ_SELECIONADOS[id] || 1) + delta);
    etqRenderLista(); etqAtualizarContador(); etqRenderPreview();
  }
  function etqSetQtd(id, v) {
    if (ETQ_SELECIONADOS[id] === undefined) return;
    ETQ_SELECIONADOS[id] = Math.max(1, parseInt(v) || 1);
    etqAtualizarContador(); etqRenderPreview();
  }
  function etqMarcarTodos(v) {
    const q = (document.getElementById('etq-busca').value || '').trim().toUpperCase();
    let lista = TODOS_PRODUTOS;
    if (q) lista = lista.filter(p => (p.nome || '').toUpperCase().includes(q) || String(p.codigo).includes(q) || (p.codigo_barras || '').toUpperCase().includes(q));
    lista.forEach(p => { if (v) ETQ_SELECIONADOS[p.id] = ETQ_SELECIONADOS[p.id] || 1; else delete ETQ_SELECIONADOS[p.id]; });
    etqRenderLista(); etqAtualizarContador(); etqRenderPreview();
  }
  function etqAtualizarContador() {
    const totalItens = Object.keys(ETQ_SELECIONADOS).length;
    const totalEtiquetas = Object.values(ETQ_SELECIONADOS).reduce((s, q) => s + q, 0);
    const cfg = etqGetCfg();
    const porFolha = Math.max(1, cfg.cols * cfg.rows);
    const folhas = totalEtiquetas ? Math.ceil(totalEtiquetas / porFolha) : 0;
    document.getElementById('etq-count').textContent = totalItens + ' produto' + (totalItens !== 1 ? 's' : '') + ' · ' + totalEtiquetas + ' etiqueta' + (totalEtiquetas !== 1 ? 's' : '') + (folhas ? ' · ' + folhas + ' folha' + (folhas !== 1 ? 's' : '') : '');
  }

  function etqGetCfg() {
    const p = document.getElementById('etq-preset').value;
    if (p === 'custom') {
      return {
        w: parseFloat(document.getElementById('etq-cfg-w').value) || 99.1,
        h: parseFloat(document.getElementById('etq-cfg-h').value) || 25.4,
        cols: parseInt(document.getElementById('etq-cfg-cols').value) || 2,
        rows: parseInt(document.getElementById('etq-cfg-rows').value) || 10,
        mt: parseFloat(document.getElementById('etq-cfg-mt').value) || 0,
        ml: parseFloat(document.getElementById('etq-cfg-ml').value) || 0,
      };
    }
    return ETQ_PRESETS[p];
  }
  function etqOnPresetChange() {
    const p = document.getElementById('etq-preset').value;
    document.getElementById('etq-cfg-panel').classList.toggle('open', p === 'custom');
    if (p !== 'custom') {
      const c = ETQ_PRESETS[p];
      document.getElementById('etq-cfg-w').value = c.w;
      document.getElementById('etq-cfg-h').value = c.h;
      document.getElementById('etq-cfg-cols').value = c.cols;
      document.getElementById('etq-cfg-rows').value = c.rows;
      document.getElementById('etq-cfg-mt').value = c.mt;
      document.getElementById('etq-cfg-ml').value = c.ml;
    }
    etqRenderPreview();
  }

  function etqListaEtiquetas() {
    const out = [];
    Object.entries(ETQ_SELECIONADOS).forEach(([id, qtd]) => {
      const p = TODOS_PRODUTOS.find(x => String(x.id) === String(id));
      if (!p) return;
      for (let i = 0; i < qtd; i++) out.push(p);
    });
    return out;
  }

  function etqRenderPreview() {
    etqAtualizarContador();
    const cfg = etqGetCfg();
    const itens = etqListaEtiquetas();
    const area = document.getElementById('etq-print-area');

    if (!itens.length) {
      area.innerHTML = '<div class="etq-preview-info" style="padding:2rem 0"><i class="ti ti-barcode" style="font-size:26px;display:block;margin-bottom:6px;opacity:.4"></i>Selecione produtos à esquerda pra ver a pré-visualização.</div>';
      return;
    }
    const porFolha = cfg.cols * cfg.rows;
    const folhas = Math.ceil(itens.length / porFolha);
    let html = '';
    for (let f = 0; f < folhas; f++) {
      const cellsFolha = itens.slice(f * porFolha, (f + 1) * porFolha);
      html += `<div class="sheet" style="width:210mm;height:297mm;padding:${cfg.mt}mm 0 0 ${cfg.ml}mm;grid-template-columns:repeat(${cfg.cols},${cfg.w}mm);grid-auto-rows:${cfg.h}mm;margin-bottom:14px">`;
      for (let i = 0; i < porFolha; i++) {
        const p = cellsFolha[i];
        if (!p) { html += `<div class="label label-empty"></div>`; continue; }
        const barId = 'etq-bc-' + f + '-' + i;
        const codigoParaBarras = p.codigo_barras || String(p.codigo).padStart(6, '0');
        html += `<div class="label">
          ${ETQ_CAMPOS.showNome ? `<div class="label-nome">${p.nome}</div>` : ''}
          ${ETQ_CAMPOS.showBarcode ? `<div class="label-barcode"><svg id="${barId}"></svg></div>` : ''}
          ${ETQ_CAMPOS.showCodigo ? `<div class="label-codigo">${codigoParaBarras}</div>` : ''}
          ${ETQ_CAMPOS.showPreco ? `<div class="label-preco">R$ ${fmtMoney(p.valor_venda)}</div>` : ''}
        </div>`;
      }
      html += '</div>';
    }
    area.innerHTML = html;
    itens.forEach((p, idx) => {
      if (!ETQ_CAMPOS.showBarcode) return;
      const f = Math.floor(idx / porFolha), i = idx % porFolha;
      const barId = 'etq-bc-' + f + '-' + i;
      const el = document.getElementById(barId);
      if (!el) return;
      const codigoParaBarras = p.codigo_barras || String(p.codigo).padStart(6, '0');
      try { JsBarcode('#' + barId, codigoParaBarras, { format: 'CODE128', displayValue: false, margin: 0, height: 34, width: 1.4 }); } catch (e) {}
    });
  }

  function etqImprimir() {
    if (!Object.keys(ETQ_SELECIONADOS).length) { alert('Selecione ao menos um produto.'); return; }
    window.print();
  }

  function toggleDropdown(id) {
    document.querySelectorAll('.dropdown-wrap.open').forEach(d => { if (d.id !== id) d.classList.remove('open'); });
    document.getElementById(id).classList.toggle('open');
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.dropdown-wrap')) {
      document.querySelectorAll('.dropdown-wrap.open').forEach(d => d.classList.remove('open'));
    }
  });

  function fmtMoney(v) {
    return (v ?? 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function estoqueClass(atual, minimo) {
    if (atual <= 0) return 'estoque-zero';
    if (minimo && atual <= minimo) return 'estoque-baixo';
    return 'estoque-ok';
  }

  function renderTable(lista) {
    const tbody = document.getElementById('produtos-tbody');

    if (!lista || lista.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="5">
        <i class="ti ti-package-off"></i>
        <div class="empty-title">Nenhum produto encontrado</div>
        <div class="empty-desc">Cadastre o primeiro produto clicando em "Adicionar".</div>
      </td></tr>`;
      document.getElementById('table-count').textContent = '0 produtos';
      return;
    }

    tbody.innerHTML = lista.map(p => `
      <tr>
        <td class="td-codigo">${String(p.codigo).padStart(3,'0')}</td>
        <td>
          <div class="td-nome">${p.nome}</div>
          ${p.grupo_nome ? `<span class="td-grupo">${p.grupo_nome}</span>` : ''}
        </td>
        <td class="td-valor">R$ ${fmtMoney(p.valor_venda)}</td>
        <td class="td-estoque ${estoqueClass(p.estoque_atual, p.estoque_minimo)}">${fmtMoney(p.estoque_atual).replace('.00','')}</td>
        <td>
          <div class="actions">
            <button class="act-btn act-mov" onclick="abrirMovimentar('${p.id}')" title="Movimentar estoque"><i class="ti ti-arrows-exchange"></i></button>
            <button class="act-btn act-edit" onclick="editarProduto('${p.id}')" title="Editar"><i class="ti ti-pencil"></i></button>
            <button class="act-btn act-del" onclick="excluirProduto('${p.id}','${p.nome.replace(/'/g,"\\'")}')" title="Excluir"><i class="ti ti-trash"></i></button>
          </div>
        </td>
      </tr>
    `).join('');

    document.getElementById('table-count').textContent = lista.length + (lista.length === 1 ? ' produto' : ' produtos');
  }

  function filterTable() {
    const q = document.getElementById('search-input').value.trim().toUpperCase();
    if (!q) { renderTable(TODOS_PRODUTOS); return; }
    const filtrado = TODOS_PRODUTOS.filter(p =>
      String(p.codigo).includes(q) ||
      (p.nome || '').toUpperCase().includes(q) ||
      (p.codigo_barras || '').toUpperCase().includes(q)
    );
    renderTable(filtrado);
  }

  function editarProduto(id) {
    window.location.href = 'produto-novo.html?id=' + id;
  }

  async function excluirProduto(id, nome) {
    if (!confirm('Excluir o produto "' + nome + '"? Essa ação não pode ser desfeita.')) return;
    const { error } = await db.from('produtos').delete().eq('id', id);
    if (error) {
      alert('Erro ao excluir: ' + error.message);
      return;
    }
    await loadProdutos();
  }

  async function loadProdutos() {
    const { data, error } = await db
      .from('produtos')
      .select('id, codigo, codigo_barras, nome, valor_venda, estoque_atual, estoque_minimo, grupo_id, grupos_produtos(nome)')
      .eq('ativo', true)
      .order('codigo', { ascending: true });

    if (error) {
      document.getElementById('produtos-tbody').innerHTML =
        `<tr class="empty-row"><td colspan="5"><i class="ti ti-alert-circle"></i><div class="empty-title">Erro ao carregar produtos</div><div class="empty-desc">${error.message}</div></td></tr>`;
      return;
    }

    TODOS_PRODUTOS = (data || []).map(p => ({ ...p, grupo_nome: p.grupos_produtos?.nome || null }));
    renderTable(TODOS_PRODUTOS);
  }

  loadProdutos();
</script>
</body>
</html>
