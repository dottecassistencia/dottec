<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pessoas — Dottec</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="_shell.js"></script>
<style>
  :root{--cyan:#29B8C2;--cd:#1E9099;--cbg:#E3F4F5;--coral:#E8604A;--coral-dark:#C94835;--cbg2:#FBE9E5;--dark:#1C1C1A;--text:#2C2C2A;--sub:#8A887F;--border:#EAE7DF;--bg:#EDEAE3;--white:#fff;--green:#3B6D11;--gbg:#EAF3DE;--amber:#9A6000;--abg:#FBEEDB;--slate:#3A4A6B;--slate-bg:#EEF0F5}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden}

  .content{max-width:1180px;margin:0 auto;padding:1.5rem;width:100%}

  /* FILTER BAR */
  .filter-bar{background:var(--white);border-bottom:1px solid var(--border)}
  .fb-top{display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
  .btn{height:34px;padding:0 14px;border-radius:8px;border:none;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;gap:6px;transition:background .15s;text-decoration:none;white-space:nowrap}
  .btn-primary{background:var(--coral);color:#fff}
  .btn-primary:hover{background:var(--coral-dark)}

  .filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .filter-btn{
    height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--white);color:var(--sub);font-size:11.5px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;font-family:inherit;white-space:nowrap;
  }
  .filter-btn i{font-size:13px}
  .filter-btn:hover{border-color:var(--cyan);color:var(--cd)}
  .filter-btn.active{background:var(--cbg);color:var(--cd);border-color:var(--cyan)}

  .search-wrap{position:relative;min-width:200px;max-width:280px}
  .search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px}
  .search-wrap input{
    width:100%;height:34px;padding:0 12px 0 34px;border-radius:8px;
    border:1.5px solid var(--border);background:#FAFAF7;font-size:12.5px;font-family:inherit;outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--cyan);background:var(--white)}

  /* BODY */
  .body{flex:1;overflow-y:auto}

  .table-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--sub);padding:12px 16px;border-bottom:1px solid var(--border);background:#FAFAF7}
  thead th.center{text-align:center}
  tbody td{padding:12px 16px;font-size:13px;color:var(--text);border-bottom:1px solid #F2F0EA}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#FAFAF7}

  .td-nome{font-weight:700;color:var(--dark)}
  .td-doc{font-size:11.5px;color:var(--sub);margin-top:2px}
  .td-telefone{font-variant-numeric:tabular-nums}

  .papeis{display:flex;gap:4px;flex-wrap:wrap}
  .papel-badge{
    font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:5px;
    display:flex;align-items:center;gap:4px;
  }
  .papel-badge i{font-size:10.5px}
  .papel-badge.cliente{background:var(--cbg);color:var(--cd)}
  .papel-badge.fornecedor{background:var(--abg);color:var(--amber)}
  .papel-badge.transportadora{background:var(--slate-bg);color:var(--slate)}

  .actions{display:flex;align-items:center;gap:6px;justify-content:flex-end}
  .act-btn{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .15s;flex-shrink:0}
  .act-edit{background:var(--cbg);color:var(--cd)}
  .act-edit:hover{background:var(--cyan);color:#fff}
  .act-wpp{background:var(--gbg);color:var(--green)}
  .act-wpp:hover{background:var(--green);color:#fff}
  .act-wpp:disabled{opacity:.35;cursor:not-allowed}
  .act-wpp:disabled:hover{background:var(--gbg);color:var(--green)}
  .act-more{background:var(--bg);color:var(--sub)}
  .act-more:hover{background:#E2DFD6;color:var(--dark)}
  .act-del{background:var(--cbg2);color:var(--coral)}
  .act-del:hover{background:var(--coral);color:#fff}

  /* DROPDOWN "MAIS AÇÕES" (compartilhado, reposicionado por linha) */
  .more-drop{display:none;position:fixed;background:var(--white);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 12px 36px rgba(0,0,0,.14);padding:6px;z-index:9999;min-width:200px}
  .more-drop.open{display:block}
  .more-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;font-size:12.5px;font-weight:600;
    color:var(--text);cursor:pointer;text-decoration:none}
  .more-item:hover{background:var(--bg)}
  .more-item i{font-size:14px;width:16px;text-align:center;color:var(--sub)}
  .more-item.danger{color:var(--coral)}
  .more-item.danger i{color:var(--coral)}

  .empty-row td{padding:3.5rem 1rem;text-align:center;color:var(--sub)}
  .empty-row i{font-size:32px;display:block;margin-bottom:10px;opacity:.4}
  .empty-title{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:4px}

  .table-footer{display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--sub)}

  /* MODAL HISTÓRICO */
  .overlay{display:none;position:fixed;inset:0;background:rgba(28,28,26,.5);z-index:9999;align-items:center;justify-content:center;padding:1rem}
  .overlay.open{display:flex}
  .modal{background:var(--white);border-radius:16px;width:100%;max-width:440px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.18)}
  .mh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
  .mh-ico{width:32px;height:32px;border-radius:8px;background:var(--cbg);color:var(--cd);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .mh-title{font-size:14px;font-weight:700;color:var(--dark);flex:1}
  .mx{width:28px;height:28px;border-radius:7px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--sub)}
  .mb{padding:10px 12px;overflow-y:auto}
  .hist-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px}
  .hist-row:hover{background:#FAFAF7}
  .hist-info{flex:1;min-width:0}
  .hist-num{font-size:12.5px;font-weight:700;color:var(--dark)}
  .hist-meta{font-size:10.5px;color:var(--sub);margin-top:1px}
  .hist-val{font-size:13px;font-weight:800;color:var(--cd);flex-shrink:0}
  .hist-empty{text-align:center;padding:2.5rem 1rem;color:var(--sub);font-size:12.5px}
  .hist-empty i{font-size:28px;display:block;margin-bottom:8px;opacity:.35}

  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @media(max-width:760px){.search-wrap{max-width:none;width:100%}}
</style>
</head>
<body>

<!-- MODAL HISTÓRICO -->
<div class="overlay" id="ov-hist" onclick="if(event.target===this)fecharHist()">
  <div class="modal">
    <div class="mh">
      <div class="mh-ico" id="hist-ico"><i class="ti ti-history"></i></div>
      <div class="mh-title" id="hist-title">Histórico</div>
      <button class="mx" onclick="fecharHist()"><i class="ti ti-x"></i></button>
    </div>
    <div class="mb" id="hist-body"><div class="hist-empty"><i class="ti ti-loader-2" style="animation:spin .8s linear infinite"></i></div></div>
  </div>
</div>

<!-- DROPDOWN "MAIS AÇÕES" (compartilhado entre linhas) -->
<div class="more-drop" id="more-drop"></div>

<div class="filter-bar">
  <div class="fb-top">
    <a class="btn btn-primary" href="pessoa-novo.html"><i class="ti ti-plus"></i> Adicionar</a>

    <div class="filters">
      <button class="filter-btn active" id="f-todos" onclick="setFiltro('todos')"><i class="ti ti-list"></i> Todos</button>
      <button class="filter-btn" id="f-cliente" onclick="setFiltro('cliente')"><i class="ti ti-user"></i> Clientes</button>
      <button class="filter-btn" id="f-fornecedor" onclick="setFiltro('fornecedor')"><i class="ti ti-truck"></i> Fornecedores</button>
      <button class="filter-btn" id="f-transportadora" onclick="setFiltro('transportadora')"><i class="ti ti-ship"></i> Transportadoras</button>
    </div>

    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="search-input" class="upper" placeholder="Buscar por nome, CPF ou CNPJ" oninput="filterTable()"/>
    </div>
  </div>
</div>

<div class="body" id="body-main">
  <main class="content" style="padding-top:.75rem">
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Nome / Documento</th>
            <th>Telefone</th>
            <th>Cidade / UF</th>
            <th class="center">Papéis</th>
            <th style="width:130px;text-align:right">Ações</th>
          </tr>
        </thead>
        <tbody id="pessoas-tbody">
          <tr class="empty-row">
            <td colspan="5"><i class="ti ti-loader-2" style="animation:spin .8s linear infinite"></i>Carregando...</td>
          </tr>
        </tbody>
      </table>
      <div class="table-footer">
        <span id="table-count">—</span>
        <span>Dottec Assistência</span>
      </div>
    </div>
  </main>
</div>

<script>
  const SB_URL='https://clctxzynpfjilxmyblpg.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY3R4enlucGZqaWx4bXlibHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzEyNDMsImV4cCI6MjA5NTM0NzI0M30.YBGIwVFpE52KZKpOjMMMh1WCZbzDLM_adwGxxXhkIL0';
const db=window._dottecDb||(()=>{const c=supabase.createClient(SB_URL,SB_KEY);window._dottecDb=c;return c;})();

  let TODOS=[];
  let FILTRO='todos';

  function setFiltro(f){
    FILTRO=f;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('f-'+f).classList.add('active');
    filterTable();
  }

  function fmtDoc(doc,tipo){
    if(!doc) return '—';
    if(tipo==='CPF') return doc.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
    return doc.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  }

  function papeisBadge(p){
    let h='<div class="papeis">';
    if(p.is_cliente)        h+=`<span class="papel-badge cliente"><i class="ti ti-user"></i>Cliente</span>`;
    if(p.is_fornecedor)     h+=`<span class="papel-badge fornecedor"><i class="ti ti-truck"></i>Fornecedor</span>`;
    if(p.is_transportadora) h+=`<span class="papel-badge transportadora"><i class="ti ti-ship"></i>Transportadora</span>`;
    return h+'</div>';
  }

  function renderTable(lista){
    const tb=document.getElementById('pessoas-tbody');
    if(!lista||lista.length===0){
      tb.innerHTML=`<tr class="empty-row"><td colspan="5"><i class="ti ti-users-off"></i><div class="empty-title">Nenhuma pessoa encontrada</div>Clique em "Adicionar" para começar.</td></tr>`;
      document.getElementById('table-count').textContent='0 registros';
      return;
    }
    tb.innerHTML=lista.map(p=>{
      const fone=(p.celular||p.telefone||'').replace(/\D/g,'');
      const wppHref=fone?`https://wa.me/55${fone}`:null;
      return `
      <tr>
        <td>
          <div class="td-nome">${p.nome}${p.nome_fantasia?` <span style="font-weight:400;color:var(--sub);font-size:12px">(${p.nome_fantasia})</span>`:''}</div>
          <div class="td-doc">${p.tipo_doc}: ${fmtDoc(p.documento,p.tipo_doc)}</div>
        </td>
        <td class="td-telefone">${p.celular||p.telefone||'—'}</td>
        <td>${p.cidade?p.cidade+(p.estado?' / '+p.estado:''):'—'}</td>
        <td>${papeisBadge(p)}</td>
        <td>
          <div class="actions">
            <button class="act-btn act-edit" onclick="window.location.href='pessoa-novo.html?id=${p.id}'" title="Editar"><i class="ti ti-pencil"></i></button>
            <button class="act-btn act-wpp" ${wppHref?'':'disabled'} onclick="${wppHref?`window.open('${wppHref}','_blank')`:''}" title="WhatsApp"><i class="ti ti-brand-whatsapp"></i></button>
            <button class="act-btn act-more" onclick="abrirMais(event,'${p.id}','${p.nome.replace(/'/g,"\\'")}')" title="Mais ações"><i class="ti ti-dots"></i></button>
          </div>
        </td>
      </tr>`;
    }).join('');
    document.getElementById('table-count').textContent=lista.length+(lista.length===1?' registro':' registros');
  }

  function filterTable(){
    const q=document.getElementById('search-input').value.trim().toUpperCase();
    let lista=TODOS;
    if(FILTRO==='cliente')        lista=lista.filter(p=>p.is_cliente);
    if(FILTRO==='fornecedor')     lista=lista.filter(p=>p.is_fornecedor);
    if(FILTRO==='transportadora') lista=lista.filter(p=>p.is_transportadora);
    if(q) lista=lista.filter(p=>(p.nome||'').toUpperCase().includes(q)||(p.documento||'').includes(q));
    renderTable(lista);
  }

  // ── DROPDOWN "MAIS AÇÕES" ──────────────────────────────────
  let _MAIS_ATUAL=null;
  function abrirMais(ev,id,nome){
    ev.stopPropagation();
    _MAIS_ATUAL={id,nome};
    const drop=document.getElementById('more-drop');
    const jaAberto=drop.classList.contains('open')&&drop.dataset.id===id;
    if(jaAberto){drop.classList.remove('open');return;}
    drop.dataset.id=id;
    drop.innerHTML=`
      <div class="more-item" onclick="verHistorico('os','${id}','${nome.replace(/'/g,"\\'")}')"><i class="ti ti-tool"></i> Ver histórico de OS</div>
      <div class="more-item" onclick="verHistorico('vendas','${id}','${nome.replace(/'/g,"\\'")}')"><i class="ti ti-shopping-cart"></i> Ver histórico de compras</div>
      <div style="height:1px;background:var(--border);margin:4px 2px"></div>
      <div class="more-item danger" onclick="excluir('${id}','${nome.replace(/'/g,"\\'")}')"><i class="ti ti-trash"></i> Excluir pessoa</div>
    `;
    const r=ev.currentTarget.getBoundingClientRect();
    drop.style.top=(r.bottom+6)+'px';
    drop.style.right=(window.innerWidth-r.right)+'px';
    drop.classList.add('open');
  }
  document.addEventListener('click',()=>document.getElementById('more-drop').classList.remove('open'));

  // ── HISTÓRICO (OS / COMPRAS) ───────────────────────────────
  // OBS: assume que 'ordens_servico' tem coluna pessoa_id — se o erro aparecer, me avisa que ajusto.
  async function verHistorico(tipo,pessoaId,nome){
    document.getElementById('more-drop').classList.remove('open');
    const isOS=tipo==='os';
    document.getElementById('hist-title').textContent=(isOS?'Histórico de OS — ':'Histórico de compras — ')+nome;
    document.getElementById('hist-ico').innerHTML=`<i class="ti ${isOS?'ti-tool':'ti-shopping-cart'}"></i>`;
    document.getElementById('hist-body').innerHTML='<div class="hist-empty"><i class="ti ti-loader-2" style="animation:spin .8s linear infinite"></i></div>';
    document.getElementById('ov-hist').classList.add('open');

    try{
      if(isOS){
        const{data,error}=await db.from('ordens_servico').select('id,numero,status,criado_em').eq('pessoa_id',pessoaId).order('criado_em',{ascending:false}).limit(30);
        if(error)throw error;
        renderHist(data,'os');
      }else{
        const{data,error}=await db.from('vendas').select('id,numero,status,total,criado_em').eq('pessoa_id',pessoaId).order('criado_em',{ascending:false}).limit(30);
        if(error)throw error;
        renderHist(data,'vendas');
      }
    }catch(e){
      document.getElementById('hist-body').innerHTML=`<div class="hist-empty"><i class="ti ti-alert-circle"></i>Erro ao carregar: ${e.message}</div>`;
    }
  }
  function renderHist(lista,tipo){
    if(!lista||!lista.length){
      document.getElementById('hist-body').innerHTML=`<div class="hist-empty"><i class="ti ti-inbox"></i>Nenhum registro encontrado</div>`;
      return;
    }
    const href=tipo==='os'?'os-nova.html?id=':'venda-nova.html?id=';
    document.getElementById('hist-body').innerHTML=lista.map(r=>`
      <a class="hist-row" href="${href}${r.id}" style="text-decoration:none;color:inherit">
        <div class="hist-info">
          <div class="hist-num">#${String(r.numero||'').padStart(4,'0')}</div>
          <div class="hist-meta">${new Date(r.criado_em).toLocaleDateString('pt-BR')} · ${r.status||''}</div>
        </div>
        ${tipo==='vendas'?`<div class="hist-val">${fmtV(r.total)}</div>`:''}
      </a>`).join('');
  }
  function fecharHist(){document.getElementById('ov-hist').classList.remove('open');}
  const fmtV=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});

  // ── MAIÚSCULO REAL (não só visual) ─────────────────────────
  document.addEventListener('input',e=>{
    if(e.target.classList&&e.target.classList.contains('upper')){
      const pos=e.target.selectionStart,posEnd=e.target.selectionEnd;
      e.target.value=e.target.value.toUpperCase();
      e.target.setSelectionRange(pos,posEnd);
    }
  });

  async function excluir(id,nome){
    document.getElementById('more-drop').classList.remove('open');
    if(!confirm('Excluir "'+nome+'"? Essa ação não pode ser desfeita.')) return;
    const{error}=await db.from('pessoas').delete().eq('id',id);
    if(error){alert('Erro: '+error.message);return;}
    await load();
  }

  async function load(){
    const{data,error}=await db.from('pessoas').select('*').eq('ativo',true).order('nome');
    if(error){
      document.getElementById('pessoas-tbody').innerHTML=`<tr class="empty-row"><td colspan="5"><i class="ti ti-alert-circle"></i><div class="empty-title">Erro ao carregar</div>${error.message}</td></tr>`;
      return;
    }
    TODOS=data||[];
    filterTable();
  }

  load();
</script>
</body>
</html>
