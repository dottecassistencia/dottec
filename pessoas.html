<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pessoas — Dottec</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="_shell.js"></script>
<style>
  :root{--cyan:#29B8C2;--cd:#1E9099;--cbg:#E3F4F5;--coral:#E8604A;--coral-dark:#C94835;--cbg2:#FBE9E5;--dark:#1C1C1A;--text:#2C2C2A;--sub:#8A887F;--border:#EAE7DF;--bg:#EDEAE3;--white:#fff;--green:#3B6D11;--gbg:#EAF3DE;--amber:#9A6000;--abg:#FBEEDB;--slate:#3A4A6B;--slate-bg:#EEF0F5}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden}

  .content{max-width:1180px;margin:0 auto;padding:1.5rem;width:100%}

  /* FILTER BAR */
  .filter-bar{background:var(--white);border-bottom:1px solid var(--border)}
  .fb-top{display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
  .btn{height:34px;padding:0 14px;border-radius:8px;border:none;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;gap:6px;transition:background .15s;text-decoration:none;white-space:nowrap}
  .btn-primary{background:var(--coral);color:#fff}
  .btn-primary:hover{background:var(--coral-dark)}

  .filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .filter-btn{
    height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--white);color:var(--sub);font-size:11.5px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;font-family:inherit;white-space:nowrap;
  }
  .filter-btn i{font-size:13px}
  .filter-btn:hover{border-color:var(--cyan);color:var(--cd)}
  .filter-btn.active{background:var(--cbg);color:var(--cd);border-color:var(--cyan)}

  .search-wrap{margin-left:auto;position:relative;min-width:200px;flex:1;max-width:280px}
  .search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px}
  .search-wrap input{
    width:100%;height:34px;padding:0 12px 0 34px;border-radius:8px;
    border:1.5px solid var(--border);background:#FAFAF7;font-size:12.5px;font-family:inherit;outline:none;
    transition:border-color .15s;text-transform:uppercase
  }
  .search-wrap input::placeholder{text-transform:none}
  .search-wrap input:focus{border-color:var(--cyan);background:var(--white)}

  /* BODY */
  .body{flex:1;overflow-y:auto}

  .table-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:1rem}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--sub);padding:12px 16px;border-bottom:1px solid var(--border);background:#FAFAF7}
  thead th.center{text-align:center}
  tbody td{padding:12px 16px;font-size:13px;color:var(--text);border-bottom:1px solid #F2F0EA}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#FAFAF7}

  .td-nome{font-weight:700;color:var(--dark)}
  .td-doc{font-size:11.5px;color:var(--sub);margin-top:2px}
  .td-telefone{font-variant-numeric:tabular-nums}

  .papeis{display:flex;gap:4px;flex-wrap:wrap}
  .papel-badge{
    font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:5px;
    display:flex;align-items:center;gap:4px;
  }
  .papel-badge i{font-size:10.5px}
  .papel-badge.cliente{background:var(--cbg);color:var(--cd)}
  .papel-badge.fornecedor{background:var(--abg);color:var(--amber)}
  .papel-badge.transportadora{background:var(--slate-bg);color:var(--slate)}

  .actions{display:flex;align-items:center;gap:6px;justify-content:flex-end}
  .act-btn{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .15s}
  .act-edit{background:var(--cbg);color:var(--cd)}
  .act-edit:hover{background:var(--cyan);color:#fff}
  .act-del{background:var(--cbg2);color:var(--coral)}
  .act-del:hover{background:var(--coral);color:#fff}

  .empty-row td{padding:3.5rem 1rem;text-align:center;color:var(--sub)}
  .empty-row i{font-size:32px;display:block;margin-bottom:10px;opacity:.4}
  .empty-title{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:4px}

  .table-footer{display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--sub)}

  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @media(max-width:760px){.search-wrap{max-width:none;width:100%;order:10}}
</style>
</head>
<body>

<div class="filter-bar">
  <div class="fb-top">
    <a class="btn btn-primary" href="pessoa-novo.html"><i class="ti ti-plus"></i> Adicionar</a>

    <div class="filters">
      <button class="filter-btn active" id="f-todos" onclick="setFiltro('todos')"><i class="ti ti-list"></i> Todos</button>
      <button class="filter-btn" id="f-cliente" onclick="setFiltro('cliente')"><i class="ti ti-user"></i> Clientes</button>
      <button class="filter-btn" id="f-fornecedor" onclick="setFiltro('fornecedor')"><i class="ti ti-truck"></i> Fornecedores</button>
      <button class="filter-btn" id="f-transportadora" onclick="setFiltro('transportadora')"><i class="ti ti-ship"></i> Transportadoras</button>
    </div>

    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="search-input" placeholder="Buscar por nome, CPF ou CNPJ" oninput="filterTable()"/>
    </div>
  </div>
</div>

<div class="body" id="body-main">
  <main class="content">
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Nome / Documento</th>
            <th>Telefone</th>
            <th>Cidade / UF</th>
            <th class="center">Papéis</th>
            <th style="width:90px;text-align:right">Ações</th>
          </tr>
        </thead>
        <tbody id="pessoas-tbody">
          <tr class="empty-row">
            <td colspan="5"><i class="ti ti-loader-2" style="animation:spin .8s linear infinite"></i>Carregando...</td>
          </tr>
        </tbody>
      </table>
      <div class="table-footer">
        <span id="table-count">—</span>
        <span>Dottec Assistência</span>
      </div>
    </div>
  </main>
</div>

<script>
  const SB_URL='https://clctxzynpfjilxmyblpg.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsY3R4enlucGZqaWx4bXlibHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzEyNDMsImV4cCI6MjA5NTM0NzI0M30.YBGIwVFpE52KZKpOjMMMh1WCZbzDLM_adwGxxXhkIL0';
const db=window._dottecDb||(()=>{const c=supabase.createClient(SB_URL,SB_KEY);window._dottecDb=c;return c;})();

  let TODOS=[];
  let FILTRO='todos';

  function setFiltro(f){
    FILTRO=f;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('f-'+f).classList.add('active');
    filterTable();
  }

  function fmtDoc(doc,tipo){
    if(!doc) return '—';
    if(tipo==='CPF') return doc.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
    return doc.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  }

  function papeisBadge(p){
    let h='<div class="papeis">';
    if(p.is_cliente)        h+=`<span class="papel-badge cliente"><i class="ti ti-user"></i>Cliente</span>`;
    if(p.is_fornecedor)     h+=`<span class="papel-badge fornecedor"><i class="ti ti-truck"></i>Fornecedor</span>`;
    if(p.is_transportadora) h+=`<span class="papel-badge transportadora"><i class="ti ti-ship"></i>Transportadora</span>`;
    return h+'</div>';
  }

  function renderTable(lista){
    const tb=document.getElementById('pessoas-tbody');
    if(!lista||lista.length===0){
      tb.innerHTML=`<tr class="empty-row"><td colspan="5"><i class="ti ti-users-off"></i><div class="empty-title">Nenhuma pessoa encontrada</div>Clique em "Adicionar" para começar.</td></tr>`;
      document.getElementById('table-count').textContent='0 registros';
      return;
    }
    tb.innerHTML=lista.map(p=>`
      <tr>
        <td>
          <div class="td-nome">${p.nome}${p.nome_fantasia?` <span style="font-weight:400;color:var(--sub);font-size:12px">(${p.nome_fantasia})</span>`:''}</div>
          <div class="td-doc">${p.tipo_doc}: ${fmtDoc(p.documento,p.tipo_doc)}</div>
        </td>
        <td class="td-telefone">${p.celular||p.telefone||'—'}</td>
        <td>${p.cidade?p.cidade+(p.estado?' / '+p.estado:''):'—'}</td>
        <td>${papeisBadge(p)}</td>
        <td>
          <div class="actions">
            <button class="act-btn act-edit" onclick="window.location.href='pessoa-novo.html?id=${p.id}'" title="Editar"><i class="ti ti-pencil"></i></button>
            <button class="act-btn act-del" onclick="excluir('${p.id}','${p.nome.replace(/'/g,"\\'")}')" title="Excluir"><i class="ti ti-trash"></i></button>
          </div>
        </td>
      </tr>`).join('');
    document.getElementById('table-count').textContent=lista.length+(lista.length===1?' registro':' registros');
  }

  function filterTable(){
    const q=document.getElementById('search-input').value.trim().toUpperCase();
    let lista=TODOS;
    if(FILTRO==='cliente')        lista=lista.filter(p=>p.is_cliente);
    if(FILTRO==='fornecedor')     lista=lista.filter(p=>p.is_fornecedor);
    if(FILTRO==='transportadora') lista=lista.filter(p=>p.is_transportadora);
    if(q) lista=lista.filter(p=>(p.nome||'').toUpperCase().includes(q)||(p.documento||'').includes(q));
    renderTable(lista);
  }

  async function excluir(id,nome){
    if(!confirm('Excluir "'+nome+'"? Essa ação não pode ser desfeita.')) return;
    const{error}=await db.from('pessoas').delete().eq('id',id);
    if(error){alert('Erro: '+error.message);return;}
    await load();
  }

  async function load(){
    const{data,error}=await db.from('pessoas').select('*').eq('ativo',true).order('nome');
    if(error){
      document.getElementById('pessoas-tbody').innerHTML=`<tr class="empty-row"><td colspan="5"><i class="ti ti-alert-circle"></i><div class="empty-title">Erro ao carregar</div>${error.message}</td></tr>`;
      return;
    }
    TODOS=data||[];
    filterTable();
  }

  load();
</script>
</body>
</html>
